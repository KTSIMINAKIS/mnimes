/* ---------------- 🔄 «Ξανακοίτα τη βιβλιοθήκη» (owner 2026-11-22) ----------------
   People open the «Μνήμες» folder with File Explorer and add, move or delete things by hand. This makes the list match the
   drive again: a file that was moved inside the library is found by its fingerprint and its new place is kept; a new file put
   in by hand is added where it is (not moved); a file that is gone is taken off the list. Nothing on the drive is changed. */
async function rescanLibrary(){if(oldGuard())return;const lib=libDest();if(!lib)return toast(EN?'First choose your library.':'Διάλεξε πρώτα τη βιβλιοθήκη σου.');
  if(await permState(lib.handle,'readwrite')!=='granted'&&!await ensurePerm(lib.handle,'readwrite'))return toast(EN?'Permission needed.':'Χρειάζεται άδεια.');
  const run=newRun(EN?'🔄 Look at the library again':'🔄 Ξανακοίτα τη βιβλιοθήκη');if(!run)return;
  run.phase=EN?'① Looking at the drive':'① Κοιτάω τον δίσκο';run.lines={[EN?'Files':'Αρχεία']:0};
  const found=new Map(),st=[{d:lib.handle,p:[]}];let bad=null;
  while(st.length&&!run.stop){await run.wait();const {d,p}=st.pop();
    try{for await(const [name,c] of d.entries()){if(c.kind==='directory'){if(!p.length&&(name===META||name===INBOX))continue;if(name.startsWith('.'))continue;st.push({d:c,p:[...p,name]});continue;}
      const e=extOf(name);if(name.startsWith('._')||!(IMG_EXT.has(e)||VID_EXT.has(e)||SIDE_EXT.has(e)))continue;found.set([...p,name].join('/'),{fh:c,p,name,ext:e});run.lines[EN?'Files':'Αρχεία']++;}}
    catch(e){bad=p.join('/')||lib.name;logErr((EN?'Read error: ':'Σφάλμα ανάγνωσης: ')+bad,e);break;}updProg();}
  if(bad)return endRun(run,EN?`⛔ Stopped: «${bad}» could not be read. Nothing was changed. The drive may have a problem — see «Drive health».`:`⛔ Σταμάτησε: δεν διαβάστηκε το «${bad}». Δεν άλλαξε τίποτα. Ίσως ο δίσκος έχει πρόβλημα — δες «Υγεία δίσκων».`);
  if(run.stop)return endRun(run,EN?'Stopped — nothing was changed.':'Διακόπηκε — δεν άλλαξε τίποτα.');
  const known=new Map();for(const p of S.photos.values()){if(p.viewOnly||p.trashed)continue;for(const fl of p.files)if(fl.rel)known.set(fl.rel,{p,fl});}
  const extra=[...found.keys()].filter(r=>!known.has(r)),missing=[...known.keys()].filter(r=>!found.has(r));
  const missByH=new Map();for(const r of missing){const x=known.get(r);missByH.set(x.fl.h,x);}
  run.phase=EN?'② New or moved files':'② Νέα ή μετακινημένα αρχεία';run.total=extra.length;run.i=0;run.t0=Date.now();
  const L={moved:EN?'Moved by hand (new place kept)':'Μετακινήθηκαν με το χέρι (κρατήθηκε η νέα θέση)',added:EN?'Added by hand (now in the list)':'Μπήκαν με το χέρι (μπήκαν στη λίστα)',dup:EN?'Second copy inside the library (left as it is)':'Δεύτερο αντίγραφο μέσα στη βιβλιοθήκη (έμεινε όπως είναι)',gone:EN?'Gone from the drive (taken off the list)':'Λείπουν από τον δίσκο (βγήκαν από τη λίστα)'};
  run.lines={[L.moved]:0,[L.added]:0,[L.dup]:0,[L.gone]:0};
  for(const r of extra){await run.wait();if(run.stop)break;const x=found.get(r);
    let rr;try{rr=await readHashed(()=>x.fh.getFile());}catch(e){logErr((EN?'Read error: ':'Σφάλμα ανάγνωσης: ')+r,e);run.i++;continue;}
    const m=missByH.get(rr.h);
    if(m){m.fl.rel=r;m.fl.v2=null;missByH.delete(rr.h);await savePhoto(m.p);run.lines[L.moved]++;}
    else if(S.photos.has(rr.h)&&!S.photos.get(rr.h).trashed){run.lines[L.dup]++;logErr((EN?'Second copy inside the library: ':'Δεύτερο αντίγραφο μέσα στη βιβλιοθήκη: ')+r);}
    else if(SIDE_EXT.has(x.ext)){}
    else{const {f,buf,h}=rr,video=VID_EXT.has(x.ext);const meta=await readMeta(buf||f,x.name,f.lastModified,video);const place=meta.lat!=null?await placeName(meta.lat,meta.lon):null;
      const p={h,name:x.name,ext:x.ext,size:f.size,date:meta.date,ds:meta.ds,lat:meta.lat,lon:meta.lon,place,video,added:Date.now(),fa:false,
        files:[{role:'main',ext:x.ext,h,size:f.size,srcs:[],origins:[(EN?'put in the library by hand: ':'μπήκε με το χέρι στη βιβλιοθήκη: ')+r],rel:r,v1:{[lib.id]:true},v2:null}]};
      const th=video?await videoThumb(f):await makeThumb(f,buf);if(th){p.w=th.w;p.hgt=th.h;p.dec=th.dec;await storeThumb(h,th.blob);writeRel(lib.handle,`${META}/thumbs/${h}.jpg`,th.blob).catch(()=>{});}
      S.photos.set(h,p);await savePhoto(p);run.lines[L.added]++;}
    run.i++;updProg();}
  if(!run.stop)for(const x of missByH.values()){const {p,fl}=x;
    if(fl.role==='main'){S.photos.delete(p.h);await dbDel('photos',p.h);}else{p.files=p.files.filter(f=>f!==fl);await savePhoto(p);}
    run.lines[L.gone]++;logErr((EN?'Gone from the drive, taken off the list: ':'Λείπει από τον δίσκο, βγήκε από τη λίστα: ')+fl.rel);}
  rebuildSrcIndex();S.ver++;S.fver++;await saveIndex();
  const t=run.lines,go=!run.stop&&(t[L.moved]+t[L.added])>0;
  if(go)setTimeout(()=>{if(S.run&&S.run.done){$('#prog').hidden=true;S.run=null;}runVerify(true);},1500);
  endRun(run,(run.stop?(EN?'Stopped. ':'Σταμάτησε. '):'')+(EN?`🔄 Done: ${fmtN(t[L.added])} added, ${fmtN(t[L.moved])} moved, ${fmtN(t[L.gone])} gone, ${fmtN(t[L.dup])} second copies. Nothing on the drive was changed.`:`🔄 Έγινε: ${fmtN(t[L.added])} μπήκαν, ${fmtN(t[L.moved])} μετακινήθηκαν, ${fmtN(t[L.gone])} λείπουν, ${fmtN(t[L.dup])} δεύτερα αντίγραφα. Στον δίσκο δεν άλλαξε τίποτα.`)+(go?(EN?' Now the double check…':' Τώρα ο διπλός έλεγχος…'):''));}
/* ---------------- Ευρετήριο μέσα στη βιβλιοθήκη (για άλλους υπολογιστές) ---------------- */
let idxTimer=null;
function scheduleIndexSave(){clearTimeout(idxTimer);idxTimer=setTimeout(saveIndex,15000);}
/* owner 2026-11-22: ONE external drive, TWO computers. Each computer remembers its own list; before 3.0 the second one would
   overwrite the drive's list with its older one, and the photos added by the first «vanished» from calendar and map.
   Now: when Mnimes opens, and every time before writing, the list on the drive is read and joined with ours. */
const idxSeen={};
async function readIdx(d){try{return JSON.parse(await (await readRel(d.handle,`${META}/index.json`)).text());}catch{return null;}}
async function syncIndex(d){if(!d||!d.handle||await permState(d.handle,'readwrite')!=='granted')return;const data=await readIdx(d);
  if(data&&typeof data==='object'&&data.saved!==idxSeen[d.id]){await importIndex(d,data,true);idxSeen[d.id]=data.saved;}}
async function saveIndex(){clearTimeout(idxTimer);if(!MAIN)return;
  try{await syncIndex(libDest());}catch(e){console.warn(e);}
  const data={app:'Mnimes',version:1,saved:new Date().toISOString(),photos:[...S.photos.values()].filter(p=>!p.viewOnly),faces:[...S.faces.values()],
    persons:[...S.persons.values()],geo:S.geo,deletions:S.deletions,sources:S.sources.map(s=>({name:s.name,errors:s.errors||0}))};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  for(const d of S.dests){if(!d.handle||await permState(d.handle,'readwrite')!=='granted')continue;
    try{await backupIdx(d);await writeRel(d.handle,`${META}/index.json`,blob);idxSeen[d.id]=data.saved;}catch(e){console.warn(e);}}}
/* owner 2026-11-22: a spare copy of the list, at most once a day (if the power is cut while writing, the list can come back) */
async function backupIdx(d){try{const k='idxBak.'+d.id,day=new Date().toISOString().slice(0,10);if(backupIdx[k]===day)return;
  const cur=await readRel(d.handle,`${META}/index.json`);if(cur.size<20)return;JSON.parse(await cur.text());
  await writeRel(d.handle,`${META}/index.prev.json`,cur);backupIdx[k]=day;}catch{}}
async function importIndex(d,data,quiet){
  if(!data){data=await readIdx(d);if(!data){try{data=JSON.parse(await (await readRel(d.handle,`${META}/index.prev.json`)).text());if(data){logErr(EN?'📂 The library list was damaged — the spare copy was used.':'📂 Η λίστα της βιβλιοθήκης ήταν χαλασμένη — χρησιμοποιήθηκε η εφεδρική.');toast(EN?'📂 The list was damaged: the spare copy was used. Press «🔄 Look at the library again» to be sure.':'📂 Η λίστα ήταν χαλασμένη: πάρθηκε η εφεδρική. Πάτα «🔄 Ξανακοίτα τη βιβλιοθήκη» για σιγουριά.',9000);}}catch{return;}}}
  let n=0,u=0;if(!data||typeof data!=='object')return;
  /* Ασφάλεια: το index.json μπορεί να έρθει από άλλον υπολογιστή — δεχόμαστε μόνο σωστά δομημένες εγγραφές */
  const okH=x=>typeof x==='string'&&/^[0-9a-f]{64}$/.test(x);
  const okRel=r=>r==null||(typeof r==='string'&&r.length<1000&&r.split('/').every(s=>!badSeg(s)));
  const okP=p=>p&&typeof p==='object'&&okH(p.h)&&Array.isArray(p.files)&&p.files.length&&p.files.every(f=>f&&typeof f==='object'&&okRel(f.rel)&&(f.h==null||okH(f.h))&&(f.srcs==null||Array.isArray(f.srcs)));
  /* owner 2026-11-21: after «Start over» and choosing another library, old months/years with BLACK tiles appeared: that drive's
     index.json also listed photos of the PREVIOUS library (the two had been open together once, and the index is written to every
     library). Now only photos whose file really is on THIS drive are loaded; the rest are only listed in the Report. */
  // the same photo, changed on the other computer (moved to the Trash, restored, deleted for good): the newer change wins
  for(const q of Array.isArray(data.photos)?data.photos:[]){if(!okP(q))continue;const p=S.photos.get(q.h);if(!p||!(+q.st>(+p.st||0)))continue;
    p.st=+q.st;if(q.trashed)p.trashed=+q.trashed||Date.now();else delete p.trashed;if(q.purged)p.purged=+q.purged;await savePhoto(p);u++;}
  const all=(Array.isArray(data.photos)?data.photos:[]).filter(p=>okP(p)&&!S.photos.has(p.h));let gone=[];
  const here=async p=>{const mf=p.files[0];if(!mf||!mf.rel)return false;return await relExists(d.handle,(p.trashed&&!p.purged?TRASH+'/':'')+mf.rel)||(!p.trashed&&await relExists(d.handle,TRASH+'/'+mf.rel));};
  if(all.length>300)toast(EN?`📂 Reading the library (${fmtN(all.length)} photos)…`:`📂 Διαβάζω τη βιβλιοθήκη (${fmtN(all.length)} φωτογραφίες)…`,4000);
  const keep=[];for(let i=0;i<all.length;i+=32){const part=all.slice(i,i+32),ok=await Promise.all(part.map(p=>here(p).catch(()=>false)));part.forEach((p,k)=>(ok[k]||p.purged?keep:gone).push(p));}
  if(gone.length)logErr(EN?`📂 «${d.name}»: ${gone.length} entries of its index have NO file on this drive (probably from another library) — not loaded. E.g.: ${gone.slice(0,5).map(p=>p.files[0].rel||p.name).join(', ')}`:`📂 «${d.name}»: ${gone.length} εγγραφές του ευρετηρίου του ΔΕΝ έχουν αρχείο σε αυτόν τον δίσκο (μάλλον από άλλη βιβλιοθήκη) — δεν φορτώθηκαν. Π.χ.: ${gone.slice(0,5).map(p=>p.files[0].rel||p.name).join(', ')}`);
  for(const p of keep){
    for(const fl of p.files){fl.origins=(fl.srcs||[]).map(s=>((data.sources||[])[s.s]||{}).name+'/'+s.p.join('/'));fl.srcs=[];
      /* owner 2026-11-23: «the 2nd check does ALL the files again — too slow». The «checked ✓» travels WITH the library: it is kept when
         the file is on this drive with exactly the same size; otherwise (or never checked) it is checked again. */
      let keepV2=typeof fl.v2==='number'&&fl.v2>0&&!p.trashed&&typeof fl.rel==='string';
      if(keepV2){try{keepV2=(await readRel(d.handle,fl.rel)).size===fl.size;}catch{keepV2=false;}}
      fl.v1=keepV2?{[d.id]:true}:{};fl.v2=keepV2?fl.v2:null;}
    p.imported=true;S.photos.set(p.h,p);await savePhoto(p);n++;}
  if(gone.length){d.cleanIdx=true;setTimeout(saveIndex,3000);} // the index on that drive is rewritten with only what is really there
  for(const f of Array.isArray(data.faces)?data.faces:[])if(f&&typeof f.id==='string'&&!S.faces.has(f.id)){S.faces.set(f.id,f);dbPut('faces',f.id,f);}
  for(const pr of Array.isArray(data.persons)?data.persons:[])if(pr&&typeof pr.id==='string'&&!S.persons.has(pr.id)){S.persons.set(pr.id,pr);dbPut('persons',pr.id,pr);}
  if(data.geo&&typeof data.geo==='object')for(const [k,v] of Object.entries(data.geo))if(typeof v==='string'&&v.length<200&&/^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(k))S.geo[k]=v;dbPut('kv','geo',S.geo);
  rebuildSrcIndex();S.ver++;S.fver++;if(quiet){if(n||u){toast(EN?`📂 From the drive (another computer): ${fmtN(n)} new${u?`, ${fmtN(u)} changed`:''}.`:`📂 Από τον δίσκο (άλλος υπολογιστής): ${fmtN(n)} νέες${u?`, ${fmtN(u)} άλλαξαν`:''}.`,5000);render();}return;}
  toast((EN?`📂 Loaded ${fmtN(n)} photos from the library.`:`📂 Φορτώθηκαν ${fmtN(n)} φωτογραφίες από τη βιβλιοθήκη.`)+(gone.length?(EN?` (${fmtN(gone.length)} old entries without a file were left out — see the Report.)`:` (${fmtN(gone.length)} παλιές εγγραφές χωρίς αρχείο αφέθηκαν έξω — δες την Αναφορά.)`):''),gone.length?9000:4000);}

/* ---------------- 2ος ΕΛΕΓΧΟΣ ---------------- */
/* Χρειάζεται έλεγχο: αρχείο χωρίς 2ο έλεγχο, ή αρχικό (όχι σβησμένο) που δεν έχει βγει σωστό */
const needsVerify=p=>p.files.some(fl=>!fl.v2||fl.srcs.some(s=>!s.deleted&&s.ok!==true));
async function runVerify(onlyNew){onlyNew=onlyNew===true;
  for(const d of S.dests)if(await permState(d.handle,'readwrite')!=='granted')return toast((EN?'Permission needed for «':'Χρειάζεται άδεια για «')+d.name+(EN?'». Press «Connect» at the top.':'». Πάτα «Σύνδεση» πάνω.'));
  const list=[...S.photos.values()].filter(p=>!p.viewOnly&&!p.trashed&&p.files[0].rel&&(!onlyNew||needsVerify(p)));
  if(!list.length)return toast((EN?'There are no copied photos yet.':'Δεν υπάρχουν ακόμα αντιγραμμένες φωτογραφίες.'));
  const usedSrc=new Set();for(const p of list)for(const fl of p.files)for(const src of fl.srcs)if(!src.deleted)usedSrc.add(src.s);
  const noPerm=[];for(const i of usedSrc){const s=S.sources[i];if(!s||!s.handle||s.removed||s.phone)continue;if(await permState(s.handle)!=='granted'&&!await ensurePerm(s.handle))noPerm.push(s.name);}
  if(noPerm.length&&!confirm((EN?`⚠️ I don’t have permission to read the ORIGINALS in:\n• ${noPerm.join('\n• ')}\n\nWithout it, these originals are NOT checked and you will NOT be able to delete them.\nPress «Cancel» and then the 🔓 buttons at the top (or connect the drive).\n\nContinue anyway?`:`⚠️ Δεν έχω άδεια να διαβάσω τα ΑΡΧΙΚΑ σε:\n• ${noPerm.join('\n• ')}\n\nΧωρίς αυτήν, αυτά τα αρχικά ΔΕΝ ελέγχονται και ΔΕΝ θα μπορείς να τα σβήσεις.\nΠάτα «Άκυρο» και μετά τα κουμπιά 🔓 στο πάνω μέρος (ή σύνδεσε τον δίσκο).\n\nΝα συνεχίσω παρ' όλα αυτά;`)))return render();
  const run=newRun((EN?'✅ 2nd check':'✅ 2ος έλεγχος'));if(!run)return;
  run.phase=(EN?'Verification':'Επαλήθευση');run.total=list.length;run.lines={[EN?'OK':'Εντάξει']:0,[EN?'Repaired':'Επισκευάστηκαν']:0,[EN?'Problems':'Προβλήματα']:0,[EN?'Originals not checked (no permission)':'Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)']:0};
  for(const p of list){await run.wait();if(run.stop)break;let photoOk=true;
    for(const fl of p.files){
      let srcBuf=null;
      for(const src of fl.srcs){if(src.deleted)continue;const s=S.sources[src.s];if(s&&s.phone)continue;if(!s||!s.handle||(s.suspicious&&!s.riskOk)||await permState(s.handle)!=='granted'){run.lines[(EN?'Originals not checked (no permission)':'Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)')]++;continue;}
        try{const f=await (await fileHandleAt(s.handle,src.p)).getFile();src.ok=f.size===fl.size&&(await hashFile(f))===fl.h;src.why=src.ok?'':(EN?'the original changed':'το αρχικό άλλαξε');if(src.ok&&!srcBuf)srcBuf=f;}
        catch(e){src.ok=false;src.why=e.name==='NotFoundError'?(EN?'missing':'λείπει'):(EN?'read error':'σφάλμα ανάγνωσης');if(e.name!=='NotFoundError')readError(s,src.p,e,null);}}
      let allOk=true;fl.v1=fl.v1||{};
      for(const d of S.dests){let ok=false;
        try{const f=await readRel(d.handle,fl.rel);ok=f.size===fl.size&&(await hashFile(f))===fl.h;}catch{}
        if(!ok&&!srcBuf)for(const d2 of S.dests){if(d2===d)continue;try{const f2=await readRel(d2.handle,fl.rel);if(f2.size===fl.size&&await hashFile(f2)===fl.h){srcBuf=f2;break;}}catch{}} // owner 2026-11-22: 2nd copy that was unplugged
        if(!ok&&srcBuf){try{await writeRel(d.handle,fl.rel,new Blob([srcBuf]));const f2=await readRel(d.handle,fl.rel);ok=(await hashFile(f2))===fl.h;
          if(ok){run.lines[(EN?'Repaired':'Επισκευάστηκαν')]++;logErr((EN?`🔧 Rewritten correctly: ${d.name}/${fl.rel}`:`🔧 Ξαναγράφτηκε σωστά: ${d.name}/${fl.rel}`));}}catch(e){if(isFull(e)){run.stop=true;run.note=(EN?'💽 The drive is full «':'💽 Γέμισε ο δίσκος «')+d.name+'».';}}}
        fl.v1[d.id]=ok;if(!ok){allOk=false;logErr((EN?`❌ Copy problem: ${d.name}/${fl.rel}`:`❌ Πρόβλημα αντιγράφου: ${d.name}/${fl.rel}`));}}
      if(allOk&&fl.role==='main'&&!p.video&&DECODE_EXT.has(fl.ext)){
        try{const b=await readRel(S.dests[0].handle,fl.rel);const bm=await createImageBitmap(b);bm.close&&bm.close();fl.corrupt=false;}
        catch(e){allOk=false;fl.corrupt=true;logErr((EN?`❌ The image doesn’t open (corrupt?): ${fl.rel}`:`❌ Η εικόνα δεν ανοίγει (χαλασμένη;): ${fl.rel}`));}}
      fl.v2=allOk?Date.now():null;if(!allOk)photoOk=false;}
    run.lines[photoOk?(EN?'OK':'Εντάξει'):(EN?'Problems':'Προβλήματα')]++;run.i++;await savePhoto(p);updProg();}
  await saveSources();await saveIndex();
  const st=stats();
  endRun(run,run.stop?(EN?'Stopped. You can run it again whenever you like.':'Σταμάτησε. Μπορείς να τον ξανατρέξεις όποτε θέλεις.'):
    (EN?`${st.v2===st.files?'✅':'⚠️'} Verified ${fmtN(st.v2)} of ${fmtN(st.files)} files in ${S.dests.length} ${S.dests.length>1?'copies':'copy'}. ${run.lines[(EN?'Problems':'Προβλήματα')]?'See the «📊 Report» for the problems.':''}${run.lines[(EN?'Originals not checked (no permission)':'Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)')]?` ⚠️ ${fmtN(run.lines[(EN?'Originals not checked (no permission)':'Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)')])} originals were NOT checked (no permission) — give permission with the 🔓 buttons at the top and run it again, otherwise they won’t be deleted.`:(run.lines[(EN?'Problems':'Προβλήματα')]?'':'All perfect!')}`:`${st.v2===st.files?'✅':'⚠️'} Επαληθεύτηκαν ${fmtN(st.v2)} από ${fmtN(st.files)} αρχεία σε ${S.dests.length} ${S.dests.length>1?'αντίγραφα':'αντίγραφο'}. ${run.lines['Προβλήματα']?'Δες την «📊 Αναφορά» για τα προβλήματα.':''}${run.lines['Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)']?` ⚠️ ${fmtN(run.lines['Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)'])} αρχικά ΔΕΝ ελέγχθηκαν (χωρίς άδεια) — δώσε άδεια με τα κουμπιά 🔓 πάνω και ξανατρέξε, αλλιώς δεν σβήνονται.`:(run.lines['Προβλήματα']?'':'Όλα τέλεια!')}`));}
function stats(){let files=0,v1=0,v2=0,locs=0,dupLocs=0,bytes=0,deleted=0,viewOnly=0;
  for(const p of S.photos.values()){if(p.trashed)continue;if(p.viewOnly){viewOnly++;continue;}
    for(const fl of p.files){files++;bytes+=fl.size||0;if(S.dests.length&&S.dests.every(d=>fl.v1&&fl.v1[d.id]))v1++;if(fl.v2)v2++;
      const live=fl.srcs.filter(s=>!s.deleted).length;locs+=fl.srcs.length;if(fl.role==='main'&&live>1)dupLocs+=live-1;deleted+=fl.srcs.filter(s=>s.deleted).length;}}
  return {photos:S.photos.size,files,v1,v2,locs,dupLocs,bytes,deleted,viewOnly};}

/* ---------------- ΚΑΘΑΡΙΣΜΟΣ ΑΡΧΙΚΩΝ (με κλειδαριές) ---------------- */
function deletionCandidates(){const out=[],b={notv2:0,susp:0,prot:0,srcbad:0,unchecked:0,nobackup:0,nohandle:0};
  for(const p of S.photos.values()){if(p.viewOnly||p.trashed)continue;
    for(const fl of p.files)for(const src of fl.srcs){if(src.deleted)continue;const s=S.sources[src.s];
      if(!s||!s.handle||s.removed){b.nohandle++;continue;}
      if(S.settings.requireBackup&&S.dests.length<2){b.nobackup++;continue;}
      if(!fl.v2||!S.dests.length||!S.dests.every(d=>fl.v1&&fl.v1[d.id])){b.notv2++;continue;}
      if(src.ok!==true){if(src.ok===false)b.srcbad++;else b.unchecked++;continue;}
      if(s.suspicious){b.susp++;continue;}
      if(src.prot||src.p.includes(LIB_DIR)||src.p.some(x=>x.toLowerCase()===META.toLowerCase())){b.prot++;continue;}
      out.push({p,fl,src,s,cloud:CLOUD_RE.test(s.name+'/'+src.p.join('/'))});}}
  return {out,blocked:b};}
async function jitCheck(c){ // 3ος έλεγχος, ακριβώς πριν το σβήσιμο
  try{const sh=await fileHandleAt(c.s.handle,c.src.p);const f=await sh.getFile();if(f.size!==c.fl.size||await hashFile(f)!==c.fl.h){c.src.ok=false;c.src.why=(EN?'the original changed':'το αρχικό άλλαξε');return false;}
    for(const d of S.dests){const dh=await fileHandleAt(d.handle,c.fl.rel.split('/'));
      if(await sh.isSameEntry(dh)){logErr((EN?'🛑 The «original» is the library copy itself — NOT deleted: ':'🛑 Το «αρχικό» είναι το ίδιο το αντίγραφο της βιβλιοθήκης — ΔΕΝ σβήνεται: ')+c.fl.rel);return false;}
      const df=await dh.getFile();if(df.size!==c.fl.size||await hashFile(df)!==c.fl.h){c.fl.v2=null;c.fl.v1[d.id]=false;return false;}}
    return true;}catch(e){return false;}}
async function runDelete(includeCloud){if(oldGuard())return;
  const {out}=deletionCandidates();const list=out.filter(c=>includeCloud||!c.cloud);
  for(const d of S.dests)if(await permState(d.handle,'read')!=='granted')return toast((EN?'Permission needed for the library «':'Χρειάζεται άδεια για τη βιβλιοθήκη «')+d.name+'».');
  for(const s of new Set(list.map(c=>c.s)))if(await permState(s.handle,'readwrite')!=='granted')return toast((EN?'First give delete permission for «':'Δώσε πρώτα άδεια διαγραφής για «')+s.name+'».');
  const run=newRun((EN?'🗑️ Deleting originals':'🗑️ Καθαρισμός αρχικών'));if(!run)return;
  const batch=Date.now();run.total=list.length;run.phase=(EN?'3rd check & delete':'3ος έλεγχος & σβήσιμο');run.lines={[EN?'Deleted':'Σβήστηκαν']:0,[EN?'Skipped (for safety)':'Παραλείφθηκαν (για ασφάλεια)']:0,[EN?'Space freed':'Χώρος που ελευθερώθηκε']:'0 B'};let freed=0;
  for(const c of list){await run.wait();if(run.stop)break;
    try{if(!await jitCheck(c)){run.lines[(EN?'Skipped (for safety)':'Παραλείφθηκαν (για ασφάλεια)')]++;logErr((EN?'Not deleted (the last check failed): ':'Δεν σβήστηκε (απέτυχε ο τελευταίος έλεγχος): ')+c.s.name+'/'+c.src.p.join('/'));}
      else{const dir=await dirAt(c.s.handle,c.src.p.slice(0,-1));await dir.removeEntry(c.src.p[c.src.p.length-1]);
        c.src.deleted=Date.now();S.deletions.push({b:batch,t:Date.now(),ph:c.p.h,h:c.fl.h,size:c.fl.size,s:c.src.s,p:c.src.p,rel:c.fl.rel});
        run.lines[(EN?'Deleted':'Σβήστηκαν')]++;freed+=c.fl.size;run.lines[(EN?'Space freed':'Χώρος που ελευθερώθηκε')]=fmtSize(freed);await savePhoto(c.p);}}
    catch(e){run.lines[(EN?'Skipped (for safety)':'Παραλείφθηκαν (για ασφάλεια)')]++;logErr((EN?'Delete failed: ':'Αποτυχία διαγραφής: ')+c.s.name+'/'+c.src.p.join('/'),e);}
    run.i++;updProg();if(run.i%25===0)dbPut('kv','deletions',S.deletions);}
  await dbPut('kv','deletions',S.deletions);await saveIndex();rebuildSrcIndex();
  endRun(run,(EN?`✅ Deleted ${fmtN(run.lines[(EN?'Deleted':'Σβήστηκαν')])} originals (${fmtSize(freed)}). The copies are safe in the library.`:`✅ Σβήστηκαν ${fmtN(run.lines['Σβήστηκαν'])} αρχικά (${fmtSize(freed)}). Τα αντίγραφα είναι ασφαλή στη βιβλιοθήκη.`));}

function meanDesc(arr){const m=new Array(128).fill(0);for(const a of arr)for(let i=0;i<128;i++)m[i]+=a[i];return m.map(v=>v/arr.length);}
function recomputePerson(pr){const fs=[...S.faces.values()].filter(f=>f.person===pr.id).sort(cmpDate);pr.count=fs.length;

  a:{el:['Όταν διαλέγεις τον δίσκο, σε ρωτάει «Να μπουν οι Μνήμες και πάνω στον δίσκο;» → ΟΚ (θέλει ίντερνετ).','Ή «⚙️ Ρυθμίσεις & άλλα» → «Ρυθμίσεις» → «💽 Βάλε τις Μνήμες στον δίσκο».','Όταν βγει νέα έκδοση, πάνω εμφανίζεται «🆕 Ενημέρωσε τις Μνήμες στον δίσκο».'],
     en:['When you choose the drive it asks «Put Mnimes on this drive too?» → OK (needs internet).','Or «⚙️ Settings & more» → «Settings» → «💽 Put Mnimes on the drive».','When a new version is out, «🆕 Update the Mnimes on the drive» appears at the top.']},
  k:{el:'ενημέρωση νέα έκδοση δίσκος αρχείο html κατέβασμα',en:'update new version drive file html download'}},
 {q:{el:'Πώς βρίσκω και σβήνω διπλότυπα;',en:'How do I find and delete duplicates?'},
  a:{el:['«⚙️ Ρυθμίσεις & άλλα» → «🔧 Για ειδικούς» → «Διπλότυπα σε άλλον δίσκο» → «Διάλεξε δίσκο ή φάκελο».','Βρίσκει μόνο τα 100% ίδια και δείχνει τι μένει και τι φεύγει. Από το καθένα μένει πάντα ΕΝΑ.','Πάτα «ΟΚ, σβήσ\' τα»: πάνε στον «Κάδο διπλοτύπων» του ίδιου δίσκου. Οριστικά σβήνονται μόνο με «Άδειασμα».'],
     en:['«⚙️ Settings & more» → «🔧 For experts» → «Duplicates on another drive» → «Choose a drive or folder».','It finds only the 100% identical ones and shows what stays and what goes. ONE of each always stays.','Press «OK, move them to the bin»: they go to the «Κάδος διπλοτύπων» of the same drive. They are deleted for good only with «Empty».']},
  k:{el:'διπλότυπα ίδιες διπλές δυο φορές αντίγραφα καθαρισμός',en:'duplicates same twice copies clean up'},go:{el:'Άνοιξε τα «Διπλότυπα»',en:'Open «Duplicates»',r:'dups'}},
 {q:{el:'Πώς σβήνω μια φωτογραφία; Μπορώ να την επαναφέρω;',en:'How do I delete a photo? Can I get it back?'},
  a:{el:['Άνοιξε τη φωτογραφία και πάτα το 🗑️ (ή πάνω δεξιά το κουμπί επιλογής για πολλές).','Πάει στον 🗑️ Κάδο: από εκεί την επαναφέρεις όποτε θες.','Οριστικά χάνεται μόνο με «Άδειασμα Κάδου» (Ρυθμίσεις & άλλα → Κάδος).'],
     en:['Open the photo and press 🗑️ (or the select button at the top right, for many).','It goes to the 🗑️ Trash: you can restore it from there whenever you like.','It is gone for good only with «Empty Trash» (Settings & more → Trash).']},
  k:{el:'σβήσιμο διαγραφή κάδος επαναφορά σβήστηκε κατά λάθος',en:'delete trash restore undo deleted by mistake'},go:{el:'Άνοιξε τον Κάδο',en:'Open the Trash',r:'trash'}},
 {q:{el:'Βλέπω μαύρα κουτάκια ή λείπουν φωτογραφίες',en:'I see black squares or photos are missing'},
  a:{el:['Συμβαίνει αν άλλαξες κάτι με το χέρι μέσα στον φάκελο «Μνήμες» (έβαλες, μετακίνησες ή έσβησες αρχεία).','Πάτα «⚙️ Ρυθμίσεις & άλλα» → «🔧 Για ειδικούς» → «🔄 Ξανακοίτα τη βιβλιοθήκη»: διορθώνει τη λίστα χωρίς να αλλάξει τίποτα στον δίσκο.','Αν ο δίσκος δεν είναι συνδεδεμένος ή πάνω γράφει «🔓», σύνδεσέ τον και πάτα το κουμπί.'],
     en:['It happens if you changed something by hand inside the «Μνήμες» folder (added, moved or deleted files).','Press «⚙️ Settings & more» → «🔧 For experts» → «🔄 Look at the library again»: it fixes the list without changing anything on the drive.','If the drive is not connected or the top says «🔌», connect it and press the button.']},
  k:{el:'μαύρα κουτάκια λείπουν χάθηκαν δεν φαίνονται άδεια λάθος λίστα',en:'black squares missing gone not showing empty wrong list'},go:{el:'Ξανακοίτα τη βιβλιοθήκη',en:'Look at the library again',r:'rescan'}},
 {q:{el:'Γιατί δεν βγαίνουν στον χάρτη;',en:'Why are they not on the map?'},
  a:{el:['Στον χάρτη μπαίνουν μόνο φωτογραφίες που έχουν μέσα τους τοποθεσία (GPS). Πολλές κάμερες και σκαναρισμένες φωτογραφίες δεν έχουν.','Ο χάρτης και τα ονόματα των μερών θέλουν ίντερνετ.','Από κινητό: φέρ\' τες με καλώδιο ή με την εφαρμογή, όχι με αποστολή από browser (χάνεται η τοποθεσία).'],
     en:['Only photos that contain a location (GPS) go on the map. Many cameras and scanned photos do not have one.','The map and the place names need internet.','From a phone: bring them with a cable or with the app, not by sending from a browser (the location is lost).']},
  k:{el:'χάρτης μέρη τοποθεσία gps δεν φαίνονται',en:'map places location gps not showing'}},
 {q:{el:'Λάθος ημερομηνία ή «Χωρίς ημερομηνία»',en:'Wrong date or «Χωρίς ημερομηνία» (no date)'},
  a:{el:['Η ημερομηνία βγαίνει από μέσα από τη φωτογραφία (EXIF) ή από το όνομα (π.χ. IMG_20230812).','Αν δεν υπάρχει πουθενά, μπαίνει στον φάκελο «Χωρίς ημερομηνία».','Αν η κάμερα είχε λάθος ώρα/ημερομηνία, η φωτογραφία θα μπει με αυτήν.'],
     en:['The date comes from inside the photo (EXIF) or from the name (e.g. IMG_20230812).','If there is none, it goes into the «Χωρίς ημερομηνία» (no date) folder.','If the camera had the wrong time/date, the photo goes in with that one.']},
  k:{el:'ημερομηνία λάθος χρονιά μήνας χωρίς ημερομηνία',en:'date wrong year month no date'}},
 {q:{el:'Ο δίσκος βγάζει σφάλματα. Τι κάνω;',en:'The drive shows errors. What do I do?'},
  a:{el:['Οι Μνήμες σταματάνε και εξηγούν. Το πιο ασφαλές: «⛔ Σταμάτα».','Για πολύτιμες φωτογραφίες, πήγαινε τον δίσκο σε εργαστήριο ανάκτησης δεδομένων.','Αλλιώς έλεγξε καλώδιο/θύρα και την «Υγεία δίσκων» στο «Ρυθμίσεις & άλλα» → «🔧 Για ειδικούς».'],
     en:['Mnimes stops and explains. The safest: «⛔ Stop».','For precious photos, take the drive to a data-recovery lab.','Otherwise check the cable/port and «Drive health» in «Settings & more» → «🔧 For experts».']},
  k:{el:'σφάλματα χαλασμένος δίσκος bad sectors δεν διαβάζεται',en:'errors failing drive bad sectors cannot read'},go:{el:'Άνοιξε την «Υγεία δίσκων»',en:'Open «Drive health»',r:'health'}},
 {q:{el:'Είναι ασφαλές; Ανεβαίνουν κάπου οι φωτογραφίες;',en:'Is it safe? Are my photos uploaded anywhere?'},
  a:{el:['Οι φωτογραφίες ΔΕΝ ανεβαίνουν πουθενά: όλα γίνονται στον υπολογιστή σου.','Κάθε αρχείο ελέγχεται με ψηφιακό αποτύπωμα (SHA-256): μένει ίδιο byte-προς-byte, ίδια ποιότητα.','Για τα ονόματα των μερών στέλνονται μόνο στρογγυλεμένες συντεταγμένες (κλείνει από τις Ρυθμίσεις).'],
     en:['The photos are NOT uploaded anywhere: everything happens on your computer.','Every file is checked with a digital fingerprint (SHA-256): it stays identical byte for byte, same quality.','For place names only rounded coordinates are sent (can be turned off in Settings).']},
  k:{el:'ασφάλεια ιδιωτικό ίντερνετ cloud ανέβασμα ποιότητα συμπίεση',en:'safe private internet cloud upload quality compression'}},
 {q:{el:'Πόσο χρόνο θέλει;',en:'How long does it take?'},
  a:{el:['Το ρίξιμο από τον ίδιο δίσκο: δευτερόλεπτα. Από άλλο δίσκο: όσο η αντιγραφή (π.χ. 100 GB ≈ 20–30 λεπτά σε USB 3).','Το μοίρασμα διαβάζει κάθε αρχείο δύο φορές (έλεγχος): περίπου 1 ώρα για 100 GB σε κανονικό δίσκο.','Η μπάρα δείχνει πόσο μένει. Αν το κλείσεις, συνεχίζει από εκεί που έμεινε.'],
     en:['Dropping from the same drive: seconds. From another drive: as long as the copy (e.g. 100 GB ≈ 20–30 minutes on USB 3).','Sorting reads each file twice (checks): about 1 hour for 100 GB on a normal drive.','The bar shows how much is left. If you close it, it continues from where it stopped.']},
  k:{el:'χρόνος πόση ώρα αργεί γρήγορα ταχύτητα',en:'time how long slow fast speed'}},
 {q:{el:'Γιατί σε iPhone, Safari ή Firefox κάνει μόνο προβολή;',en:'Why does it only show photos on iPhone, Safari or Firefox?'},
  a:{el:['Αυτοί οι browsers δεν επιτρέπουν σε σελίδες να γράφουν σε φακέλους.','Για αντιγραφή και ταξινόμηση άνοιξε τις Μνήμες με Chrome ή Edge σε υπολογιστή.'],
     en:['These browsers do not let pages write into folders.','For copying and sorting, open Mnimes with Chrome or Edge on a computer.']},
  k:{el:'safari firefox iphone ipad προβολή δεν γράφει browser',en:'safari firefox iphone ipad view only browser'}},
 {q:{el:'Έχω παλιό ή ύποπτο δίσκο. Πώς τον μαζεύω με ασφάλεια;',en:'I have an old or suspicious drive. How do I collect it safely?'},
  a:{el:['«⚙️ Ρυθμίσεις & άλλα» → «🔧 Για ειδικούς» → «Πάρε & μοίρασε»: διαλέγεις από πού και πού, και ΑΝΤΙΓΡΑΦΕΙ (τα αρχικά μένουν).','Κάθε αντίγραφο συγκρίνεται με το αρχικό. Αν ο δίσκος βγάλει σφάλμα, σταματάει.','Τα αρχικά δεν σβήνονται ποτέ από τις Μνήμες: μένουν όπως ήταν.'],
     en:['«⚙️ Settings & more» → «🔧 For experts» → «Take & sort»: choose from where and where to, and it COPIES (the originals stay).','Every copy is compared with the original. If the drive gives an error, it stops.','Mnimes never deletes the originals: they stay as they were.']},
  k:{el:'παλιός δίσκος ύποπτος αντιγραφή αρχικά πάρε μοίρασε',en:'old drive suspicious copy originals take sort'},go:{el:'Άνοιξε το «Πάρε & μοίρασε»',en:'Open «Take & sort»',r:'organize'}},
 {q:{el:'Γράφει «ήδη ανοιχτές σε άλλη καρτέλα»',en:'It says «already open in another tab»'},
  a:{el:['Οι Μνήμες δουλεύουν σε μία καρτέλα κάθε φορά, για να μη γράφουν δύο μαζί.','Κλείσε τη δεύτερη καρτέλα ή παράθυρο και δούλεψε στην πρώτη.'],
     en:['Mnimes works in one tab at a time, so that two do not write together.','Close the second tab or window and work in the first one.']},
  k:{el:'καρτέλα παράθυρο ανοιχτές δύο φορές',en:'tab window open twice'}}
];

  items:VOITHOS_ITEMS.map(it=>it.go?Object.assign({},it,{go:Object.assign({},it.go,{fn:()=>nav(it.go.r)})}):it)});if(q)h.search(q);return h;}

/* is there a newer Mnimes on the official page? (one small file, at most once a day; nothing about you is sent) */
async function checkUpdate(){try{const last=+localStorage.getItem('mnimes.updT')||0;let v=localStorage.getItem('mnimes.updV');
  if(Date.now()-last>864e5){const r=await fetch('https://ktsiminakis.github.io/mnimes/version.json',{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
    if(r.ok){const j=await r.json();v=typeof j.version==='string'&&/^\d+(\.\d+){0,3}$/.test(j.version)?j.version:null;localStorage.setItem('mnimes.updV',v||'');localStorage.setItem('mnimes.updT',String(Date.now()));}}
  return v&&verNum(v)>verNum(MNIMES_VER)?v:null;}catch{return null;}}

function dev(name,size){size=size||56;
  if(DEVPH[name]){const w=Math.round(size*2.1),h=Math.round(w*0.7);const f=el('span',{class:'glassph','aria-hidden':'true',style:`width:${w}px;height:${h}px`});f.append(el('img',{src:DEVPH[name],alt:'',loading:'lazy',decoding:'async'}));return f;}
  const s=el('span',{class:'dev','aria-hidden':'true'});s.innerHTML=`<svg viewBox="0 0 64 64" width="${size}" height="${size}">${DEV[name]||''}</svg>`;return s;}
function devc(name,size,cap){return el('figure',{class:'devc'},dev(name,size),el('figcaption',{},cap));}
function icon(name){const s=el('span',{class:'ico','aria-hidden':'true'});s.innerHTML=`<svg viewBox="0 0 24 24">${ICONS[name]||''}</svg>`;return s;}
function tiles(arr){return el('div',{class:'tiles'},arr.map(([ic,t,s,h,c])=>el('button',{class:'tile',style:c?'--c:'+c:null,onclick:()=>nav(h)},
  el('span',{class:'ic'},ICONS[ic]?icon(ic):ic),el('span',{class:'tt'},el('b',{},t),s?el('small',{},s):null),el('span',{class:'chev'},icon('chevron-right')))));}

function coverTile(title,sub,p,onclick,off){const c=el('div',{class:'cimg'});const t=el('button',{class:'ctile'+(off?' off':''),onclick:off?null:onclick},c,el('div',{class:'cap'},el('b',{},title),sub?el('small',{},sub):null));if(p)lazy(c,{h:p.h});return t;}
/* ---- Επιλογή πολλών για σβήσιμο / επαναφορά ---- */
let SEL=null,PAGE=[];
const inTrashView=()=>location.hash.slice(1).split('/')[0]==='trash';
function updSel(){const on=!!SEL;document.body.classList.toggle('selecting',on);$('#selbar').hidden=!on;$('#selBtn').hidden=!FS_OK||!S.dests.length;
  $('#selBtn').classList.toggle('on',on);if(!on)return;
  $('#selCount').textContent=SEL.size?(EN?`${fmtN(SEL.size)} selected`:`${fmtN(SEL.size)} επιλεγμένα`):(EN?'Tap photos/videos to select them':'Πάτα φωτογραφίες/βίντεο για να τα επιλέξεις');
  $('#selAct').replaceChildren(icon(inTrashView()?'undo-2':'trash-2'),inTrashView()?(EN?'Restore':'Επαναφορά'):(EN?'Delete from everywhere':'Σβήσιμο από παντού'));$('#selAct').className='btn '+(inTrashView()?'primary':'danger');$('#selAct').disabled=!SEL.size;}
function toggleSel(p,t){if(SEL.has(p.h)){SEL.delete(p.h);t.classList.remove('sel');}else{SEL.add(p.h);t.classList.add('sel');}updSel();}
$('#selBtn').onclick=()=>{SEL=SEL?null:new Set();document.querySelectorAll('.thumb.sel').forEach(t=>t.classList.remove('sel'));updSel();if(SEL)toast((EN?'Tap the photos/videos you want, then the red button below.':'Πάτα τις φωτογραφίες/βίντεο που θέλεις και μετά το κόκκινο κουμπί κάτω.'));};
$('#selCancel').onclick=()=>{SEL=null;document.querySelectorAll('.thumb.sel').forEach(t=>t.classList.remove('sel'));updSel();};
$('#selAll').onclick=()=>{if(!SEL)return;for(const p of PAGE)SEL.add(p.h);document.querySelectorAll('.thumb[data-h]').forEach(t=>{if(SEL.has(t.dataset.h))t.classList.add('sel');});updSel();};
$('#selAct').onclick=async()=>{if(!SEL||!SEL.size)return;const list=[...SEL].map(h=>S.photos.get(h)).filter(Boolean);const tr=inTrashView();SEL=null;updSel();
  if(tr)await restorePhotos(list);else await trashPhotos(list);};
function gallery(list,lbList=list,offset=0){const wrap=el('div'),grid=el('div',{class:'grid'});let i=0;PAGE.push(...list);
  const more=el('button',{class:'btn ghost',style:'margin:12px auto;display:block'},(EN?'More…':'Περισσότερες…'));
  const chunk=()=>{const end=Math.min(list.length,i+240);for(;i<end;i++){const k=i,p=list[k];const t=lazy(el('div',{class:'thumb'+(SEL&&SEL.has(p.h)?' sel':''),title:fmtDate(p.date,true),onclick:e=>SEL?toggleSel(p,e.currentTarget):openLB(lbList,offset+k)}),{h:p.h});
      if(p.video)t.append(el('span',{class:'badge'},icon('play'),p.dur?fmtDur(p.dur):''));grid.append(t);}more.style.display=i<list.length?'':'none';};
  more.onclick=chunk;new IntersectionObserver(es=>{if(es[0].isIntersecting&&i<list.length)chunk();},{rootMargin:'800px'}).observe(more);
  chunk();wrap.append(grid,more);return wrap;}
function stepper(label,prev,next){return el('div',{class:'stepper'},el('button',{class:'btn','aria-label':(EN?'Back':'Πίσω'),onclick:prev,disabled:!prev},icon('chevron-left')),el('b',{},label),el('button',{class:'btn','aria-label':(EN?'Forward':'Μπροστά'),onclick:next,disabled:!next},icon('chevron-right')));}

async function trashLeftovers(list){ // αρχικά που έμειναν επειδή ο δίσκος έλειπε

  for(const i of ids){const s=S.sources[i];if(s&&s.handle&&!s.removed)await ensurePerm(s.handle,'readwrite');}
  let n=0;for(const p of list){for(const fl of p.files)for(const src of fl.srcs){if(src.deleted||src.prot)continue;const s=S.sources[src.s];if(!s||!s.handle||await permState(s.handle,'readwrite')!=='granted')continue;
      try{const f=await (await fileHandleAt(s.handle,src.p)).getFile();if(f.size!==fl.size||await hashFile(f)!==fl.h)continue;
        if(!await goodCopy(p,fl,true))continue; // σβήνεται ΜΟΝΟ αν υπάρχει σωστό αντίγραφο στον Κάδο
        await removeRel(s.handle,src.p);src.deleted=Date.now();src.trashed=true;(p.trashSrc=p.trashSrc||[]).push({s:src.s,p:src.p,h:fl.h,rel:fl.rel});n++;}catch{}}
    await savePhoto(p);}

function initMap(div,pls){if(!window.L){div.replaceWith(card((EN?'The map needs an internet connection.':'Ο χάρτης χρειάζεται σύνδεση στο ίντερνετ.')));return;}

 ['What it is','Mnimes for Life (Mnimes) is a free app that copies your photos and videos from the folders and drives you choose into one library folder, sorted by year, month and place, and shows them in a calendar and a map. It runs entirely in your browser, on your own computer.'],
 ['Your data stays with you','Your photos and videos never leave your computer and the creator never sees or collects them. The app’s index stays in this browser (IndexedDB) and in the «Μνήμες/_PhotoApp» folder of your library. There is no account, no ads and no tracking.'],
 ['What is sent over the internet','• Place names: only coordinates rounded to 2 decimals (about 1 km) go to BigDataCloud and, if needed, to OpenStreetMap Nominatim. You can turn this off in Settings.\n• Map: map pieces come from Esri’s servers, which see your IP address and the area you look at.\n• Font and libraries: the Inter font comes from Google Fonts and the exifr and Leaflet libraries from jsDelivr and cdnjs, which see your IP address.\n• «From the phone» (Wi-Fi): so that the phone can find the computer, two short connection notes pass through the meeting point mnimes-pair (Cloudflare), encrypted with a key that exists only inside the QR code; they are deleted after 15 minutes. A Cloudflare STUN server sees your IP address to open the connection. The photos go directly from the phone to the computer, encrypted (WebRTC), and do not pass through any server. Nothing is deleted on the phone.\n• New version: the downloaded app asks, at most once a day, for one small file (version.json) from the Mnimes page on GitHub, to tell you if a new version is out. GitHub sees your IP address.\nNo photo, file name or folder name is ever sent to a server.'],
 ['New in 3.0 — what they do',"• «Drop it all here» (the folder «Ρίξ' τα όλα εδώ» inside your library): whatever you put in it is MOVED into Year/Month/Place on the same drive (not copied: the bytes stay the same and no extra space is used). After that the files are no longer in that folder, and if you moved them there from the same drive, the library is their ONLY copy — keep a 2nd copy on another drive. Files that are not photos/videos, or cannot be read, stay where they are. A copy made with File Explorer is not checked against its original; for old or suspicious drives use «Take & sort» (Advanced).\n• «Find duplicates»: only files identical byte for byte; one always stays; the others are moved into a «Κάδος διπλοτύπων» folder on the same drive and are deleted for good only when you press «Empty».\n• «Look at the library again»: only reads the drive and corrects the list; it changes nothing on the drive.\n• «Only check» / «Are they all on the computer?»: the phone sends to the computer ONLY the SHA-256 fingerprints of its photos (directly, encrypted, like the photos), not the photos. Before deleting from a phone that backs up to Google Photos or another cloud: deleting on the phone may delete them from that cloud too.\n• If the phone changes Wi-Fi, the connection is opened again by itself with new sealed notes through the same meeting point (mnimes-pair).\n• «Put Mnimes on the drive» / «Update»: the official file is downloaded from ktsiminakis.github.io (GitHub, which sees your IP address), checked, and written into your «Μνήμες» folder. Each copy of the app keeps its own memory in the browser.\n• «🙋 Helper»: questions and answers written by the creator, inside the app; it uses no AI and no internet, and sends nothing."],
 ['Your rights (GDPR)','The creator holds no personal data of yours. You can delete the app’s memory at any time from Settings → «Start over» (your photos are not touched). Questions: ktsiminakis@gmail.com. You may complain to the Hellenic Data Protection Authority (www.dpa.gr).'],
 ['Liability','The app is provided «as is», free of charge, without any warranty. The SHA-256 checks greatly reduce the risk but cannot remove it: drives fail, cables come loose, cloud folders sync. Before deleting originals, always keep a second copy on another drive. Deleting originals happens only after the double check and after the user types the word DELETE; it cannot be undone. Deleting from a cloud folder (OneDrive, Google Drive, iCloud, Dropbox) also deletes from your other devices. The creator is not liable for any loss or damage from its use. Dates, places and duplicates are detected automatically and may be wrong.'],
 ['Drives with errors','If a drive gives read errors, the app LOCKS it: its files can be copied (to rescue them) but nothing is deleted from it. Files that cannot be read are not copied, and a failing drive may give damaged data even without an error. Only the user can unlock a drive, after the copy, by ticking «I understand» and typing UNLOCK; from then on, deleting its originals (always only after the double check) is the user’s own responsibility. For precious photos on a failing drive, the app advises a data-recovery lab.'],
 ['Copyright','The app (code, design, texts, images, name, presentation and videos) belongs to its creator. Copying, republishing, changing or selling it, in whole or in part, without the creator’s written permission is forbidden. Your photos are yours. Mnimes is an independent app and is not connected with Microsoft, Google, Apple, Esri or any other company named in it.'],
 ['The «Mnimes for Life» app for Android','The app READS the photos and videos of the phone folders you choose, as originals with their location (Android asks you for the «photos and videos» and «photo location» permissions); it never changes or deletes them. It WRITES only into the folder or USB drive you choose (a «Μνήμες» library, same as on the computer) and it reads every copy back to check it (SHA-256). It sends: for place names, only coordinates rounded to 2 decimals to BigDataCloud / OpenStreetMap Nominatim; over Wi-Fi to the computer, the same as «From the phone» above (two sealed notes through mnimes-pair, the photos directly to the computer). The camera is used only to read the QR code, nothing is recorded. The app has no account, no ads and no tracking, and sends nothing to its creator.'],
 ['Third-party software and data','exifr (MIT, © Mike Kovařík) · Leaflet (BSD-2-Clause, © Volodymyr Agafonkin, © CloudMade) · Lucide icons (ISC, © Lucide Contributors; parts MIT, © Cole Bemis / Feather) · Inter font (SIL Open Font License 1.1, © The Inter Project Authors) · qrcode-generator (MIT, © Kazuhiko Arase) · Android app: ZXing and ZXing Android Embedded (Apache-2.0, © ZXing authors, © JourneyApps), AndroidX ExifInterface & WebKit (Apache-2.0, © The Android Open Source Project) · map: Powered by Esri — © Esri and its data providers · place names: BigDataCloud, © OpenStreetMap contributors (ODbL). They belong to their creators and are used under their licences. · Device photos: Pexels License (free use, no attribution required) — Andrea Piacquadio, Jakub Zerdzicki, Kindel Media, Lucas Pezeta, MOHI SYED, Mikhail Nilov, cottonbro studio (pexels.com)'],
 ['Contact','Creator and responsible for the app: Konstantinos Tsiminakis · ktsiminakis@gmail.com']]
:[
 ['Τι είναι','Οι Μνήμες για Πάντα (Μνήμες) είναι δωρεάν εφαρμογή που αντιγράφει τις φωτογραφίες και τα βίντεό σου από τους φακέλους και τους δίσκους που διαλέγεις σε έναν φάκελο-βιβλιοθήκη, τακτοποιημένα ανά χρονιά, μήνα και μέρος, και τα δείχνει σε ημερολόγιο και χάρτη. Τρέχει ολόκληρη μέσα στον browser, στον δικό σου υπολογιστή.'],
 ['Τα δεδομένα σου μένουν σε σένα','Οι φωτογραφίες και τα βίντεό σου δεν φεύγουν ποτέ από τον υπολογιστή σου και ο δημιουργός δεν τα βλέπει ούτε τα συλλέγει. Το ευρετήριο της εφαρμογής μένει σε αυτόν τον browser (IndexedDB) και στον φάκελο «Μνήμες/_PhotoApp» της βιβλιοθήκης σου. Δεν υπάρχει λογαριασμός, διαφημίσεις ή παρακολούθηση.'],
 ['Τι στέλνεται στο ίντερνετ','• Ονόματα μερών: μόνο συντεταγμένες στρογγυλεμένες σε 2 δεκαδικά (περίπου 1 χλμ.) πάνε στο BigDataCloud και, αν χρειαστεί, στο OpenStreetMap Nominatim. Το κλείνεις από τις Ρυθμίσεις.\n• Χάρτης: τα κομμάτια του χάρτη έρχονται από τους servers της Esri, που βλέπουν τη διεύθυνση IP και την περιοχή που κοιτάς.\n• Γραμματοσειρά και βιβλιοθήκες: η γραμματοσειρά Inter έρχεται από το Google Fonts και οι βιβλιοθήκες exifr και Leaflet από τα jsDelivr και cdnjs, που βλέπουν τη διεύθυνση IP.\n• «Από κινητό» (Wi-Fi): για να βρει το κινητό τον υπολογιστή, περνούν από το σημείο συνάντησης mnimes-pair (Cloudflare) δύο μικρά σημειώματα σύνδεσης, κρυπτογραφημένα με κλειδί που υπάρχει μόνο μέσα στο QR· σβήνονται σε 15 λεπτά. Ένας server STUN της Cloudflare βλέπει τη διεύθυνση IP για να ανοίξει η σύνδεση. Οι φωτογραφίες πάνε απευθείας από το κινητό στον υπολογιστή, κρυπτογραφημένες (WebRTC), και δεν περνούν από κανέναν server. Στο κινητό δεν σβήνεται τίποτα.\n• Νέα έκδοση: η κατεβασμένη εφαρμογή ζητά το πολύ μία φορά τη μέρα ένα μικρό αρχείο (version.json) από τη σελίδα των Μνημών στο GitHub, για να σου πει αν βγήκε νέα έκδοση. Το GitHub βλέπει τη διεύθυνση IP.\nΚαμία φωτογραφία, όνομα αρχείου ή φακέλου δεν στέλνεται ποτέ σε server.'],
 ['Νέα στην 3.0 — τι κάνουν',"• «Ρίξ' τα όλα εδώ» (ο φάκελος μέσα στη βιβλιοθήκη σου): ό,τι βάζεις εκεί ΜΕΤΑΚΙΝΕΙΤΑΙ σε Χρονιά/Μήνα/Μέρος στον ίδιο δίσκο (δεν αντιγράφεται: τα bytes μένουν ίδια και δεν πιάνεται επιπλέον χώρος). Μετά τα αρχεία δεν είναι πια σε εκείνον τον φάκελο, και αν τα μετακίνησες εκεί από τον ίδιο δίσκο, η βιβλιοθήκη είναι το ΜΟΝΑΔΙΚΟ αντίγραφό τους — κράτα 2ο αντίγραφο σε άλλον δίσκο. Όσα δεν είναι φωτογραφίες/βίντεο ή δεν διαβάζονται μένουν εκεί που είναι. Η αντιγραφή με την Εξερεύνηση αρχείων δεν ελέγχεται με το αρχικό· για παλιούς ή ύποπτους δίσκους χρησιμοποίησε το «Πάρε & μοίρασε» (Προχωρημένες).\n• «Βρες διπλότυπα»: μόνο αρχεία ίδια byte-προς-byte· ένα μένει πάντα· τα άλλα μετακινούνται σε φάκελο «Κάδος διπλοτύπων» στον ίδιο δίσκο και σβήνονται οριστικά μόνο όταν πατήσεις «Άδειασμα».\n• «Ξανακοίτα τη βιβλιοθήκη»: μόνο διαβάζει τον δίσκο και διορθώνει τη λίστα· στον δίσκο δεν αλλάζει τίποτα.\n• «Μόνο έλεγχος» / «Είναι όλες στον υπολογιστή;»: το κινητό στέλνει στον υπολογιστή ΜΟΝΟ τα αποτυπώματα SHA-256 των φωτογραφιών του (απευθείας, κρυπτογραφημένα, όπως και τις φωτογραφίες), όχι τις φωτογραφίες. Πριν σβήσεις από κινητό που κάνει αντίγραφο στο Google Photos ή σε άλλο cloud: το σβήσιμο στο κινητό μπορεί να τις σβήσει και από εκεί.\n• Αν το κινητό αλλάξει Wi-Fi, η σύνδεση ξανανοίγει μόνη της με νέα σφραγισμένα σημειώματα μέσω του ίδιου σημείου συνάντησης (mnimes-pair).\n• «Βάλε τις Μνήμες στον δίσκο» / «Ενημέρωση»: το επίσημο αρχείο κατεβαίνει από το ktsiminakis.github.io (GitHub, που βλέπει τη διεύθυνση IP), ελέγχεται και γράφεται στον φάκελο «Μνήμες» σου. Κάθε αντίγραφο της εφαρμογής κρατά δική του μνήμη στον browser.\n• «🙋 Βοηθός»: ερωτήσεις και απαντήσεις γραμμένες από τον δημιουργό, μέσα στην εφαρμογή· δεν χρησιμοποιεί AI ούτε ίντερνετ και δεν στέλνει τίποτα."],
 ['Τα δικαιώματά σου (GDPR)','Ο δημιουργός δεν κρατά κανένα προσωπικό σου δεδομένο. Σβήνεις τη μνήμη της εφαρμογής όποτε θέλεις από Ρυθμίσεις → «Ξεκίνα από την αρχή» (οι φωτογραφίες σου δεν αγγίζονται). Για ερωτήσεις: ktsiminakis@gmail.com. Έχεις δικαίωμα καταγγελίας στην Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (www.dpa.gr).'],
 ['Ευθύνη','Η εφαρμογή δίνεται «ως έχει», δωρεάν, χωρίς καμία εγγύηση. Οι έλεγχοι SHA-256 μειώνουν πολύ τον κίνδυνο αλλά δεν τον μηδενίζουν: δίσκοι χαλάνε, καλώδια βγαίνουν, φάκελοι cloud συγχρονίζονται. Πριν σβήσεις αρχικά, κράτα πάντα δεύτερο αντίγραφο σε άλλον δίσκο. Το σβήσιμο των αρχικών γίνεται μόνο μετά τον διπλό έλεγχο και αφού ο χρήστης γράψει τη λέξη ΔΙΑΓΡΑΦΗ· δεν αναιρείται. Το σβήσιμο από φάκελο cloud (OneDrive, Google Drive, iCloud, Dropbox) σβήνει και από τις άλλες συσκευές σου. Ο δημιουργός δεν ευθύνεται για απώλεια ή ζημιά από τη χρήση της. Ημερομηνίες, μέρη και διπλότυπα βρίσκονται αυτόματα και μπορεί να είναι λάθος.'],
 ['Δίσκοι με σφάλματα','Αν ένας δίσκος βγάζει σφάλματα ανάγνωσης, η εφαρμογή τον ΚΛΕΙΔΩΝΕΙ: τα αρχεία του μπορούν να αντιγραφούν (για να σωθούν), αλλά δεν σβήνεται τίποτα από αυτόν. Όσα αρχεία δεν διαβάζονται δεν αντιγράφονται, και ένας δίσκος που χαλάει μπορεί να δώσει χαλασμένα δεδομένα ακόμα και χωρίς σφάλμα. Μόνο ο χρήστης μπορεί να ξεκλειδώσει έναν δίσκο, μετά την αντιγραφή, τσεκάροντας «Κατάλαβα» και γράφοντας ΞΕΚΛΕΙΔΩΜΑ· από εκεί και πέρα το σβήσιμο των αρχικών του (πάντα μόνο μετά τον διπλό έλεγχο) γίνεται με δική του ευθύνη. Για πολύτιμες φωτογραφίες σε δίσκο που χαλάει, η εφαρμογή συνιστά εργαστήριο ανάκτησης δεδομένων. Ο χρήστης μπορεί επίσης να σβήσει τα αρχικά μόνος του, με το χέρι, έξω από την εφαρμογή· αυτό γίνεται εξ ολοκλήρου με δική του ευθύνη.'],
 ['Πνευματικά δικαιώματα','Η εφαρμογή (κώδικας, σχέδιο, κείμενα, εικόνες, όνομα, παρουσίαση και βίντεο) ανήκει στον δημιουργό της. Απαγορεύεται η αντιγραφή, η αναδημοσίευση, η τροποποίηση ή η πώληση της εφαρμογής ή μέρους της χωρίς γραπτή άδεια του δημιουργού. Οι φωτογραφίες σου είναι δικές σου. Οι Μνήμες είναι ανεξάρτητη εφαρμογή και δεν συνδέονται με τη Microsoft, τη Google, την Apple, την Esri ή άλλη εταιρεία που αναφέρεται.'],
 ['Η εφαρμογή «Μνήμες για Πάντα» για Android','Η εφαρμογή ΔΙΑΒΑΖΕΙ τις φωτογραφίες και τα βίντεο των φακέλων του κινητού που διαλέγεις, αυθεντικά με την τοποθεσία τους (το Android σου ζητά τις άδειες «φωτογραφίες και βίντεο» και «τοποθεσία φωτογραφιών»)· δεν τα αλλάζει και δεν τα σβήνει ποτέ. ΓΡΑΦΕΙ μόνο στον φάκελο ή στον δίσκο USB που διαλέγεις (βιβλιοθήκη «Μνήμες», ίδια με του υπολογιστή) και ξαναδιαβάζει κάθε αντίγραφο για έλεγχο (SHA-256). Στέλνει: για τα ονόματα μερών, μόνο συντεταγμένες στρογγυλεμένες σε 2 δεκαδικά στο BigDataCloud / OpenStreetMap Nominatim· μέσω Wi-Fi προς τον υπολογιστή, ό,τι και το «Από κινητό» πιο πάνω (δύο σφραγισμένα σημειώματα μέσω του mnimes-pair, οι φωτογραφίες απευθείας στον υπολογιστή). Η κάμερα χρησιμοποιείται μόνο για να διαβαστεί το QR, δεν καταγράφεται τίποτα. Η εφαρμογή δεν έχει λογαριασμό, διαφημίσεις ή παρακολούθηση και δεν στέλνει τίποτα στον δημιουργό της.'],
 ['Λογισμικό και δεδομένα τρίτων','exifr (MIT, © Mike Kovařík) · Leaflet (BSD-2-Clause, © Volodymyr Agafonkin, © CloudMade) · εικονίδια Lucide (ISC, © Lucide Contributors· τμήματα MIT, © Cole Bemis / Feather) · γραμματοσειρά Inter (SIL Open Font License 1.1, © The Inter Project Authors) · qrcode-generator (MIT, © Kazuhiko Arase) · εφαρμογή Android: ZXing και ZXing Android Embedded (Apache-2.0, © ZXing authors, © JourneyApps), AndroidX ExifInterface & WebKit (Apache-2.0, © The Android Open Source Project) · χάρτης: Powered by Esri — © Esri και οι πάροχοι δεδομένων της · ονόματα μερών: BigDataCloud, © OpenStreetMap contributors (ODbL). Ανήκουν στους δημιουργούς τους και χρησιμοποιούνται σύμφωνα με τις άδειές τους. · Φωτογραφίες συσκευών: Άδεια Pexels (δωρεάν χρήση, χωρίς υποχρέωση αναφοράς) — Andrea Piacquadio, Jakub Zerdzicki, Kindel Media, Lucas Pezeta, MOHI SYED, Mikhail Nilov, cottonbro studio (pexels.com)'],
 ['Επικοινωνία','Δημιουργός και υπεύθυνος της εφαρμογής: Κωνσταντίνος Τσιμινάκης · ktsiminakis@gmail.com']];

function viewOpen(m){setTitle((EN?'Open library':'Άνοιγμα βιβλιοθήκης'));
  m.append(card(el('p',{},(EN?'If you already have a «Μνήμες» folder (e.g. on an external drive or from another computer), open it here: the calendar and map load right away — no new analysis.':'Αν έχεις ήδη φάκελο «Μνήμες» (π.χ. σε εξωτερικό δίσκο ή από άλλον υπολογιστή), άνοιξέ τον εδώ: φορτώνονται αμέσως ημερολόγιο και χάρτης — χωρίς ξανά ανάλυση.')),
    FS_OK?el('button',{class:'btn primary big',onclick:()=>{if(S.dests.length)return toast((EN?'There is already a library here. For another one: Settings → «Start over».':'Υπάρχει ήδη βιβλιοθήκη εδώ. Για άλλη: Ρυθμίσεις → «Ξεκίνα από την αρχή».'));pickDest('primary');}},icon('folder-open'),(EN?'Choose the «Μνήμες» folder':'Διάλεξε τον φάκελο «Μνήμες»'))
      :el('p',{class:'warn'},(EN?'Needs Chrome or Edge on a computer.':'Χρειάζεται Chrome ή Edge σε υπολογιστή.'))));}
function viewOpenFiles(m){setTitle((EN?'Open photos':'Άνοιγμα φωτογραφιών'));
  const inp=el('input',{type:'file',multiple:true,accept:'image/*,video/*',style:'display:none'});inp.onchange=()=>processFiles(inp.files);
  const dir=el('input',{type:'file',multiple:true,style:'display:none'});dir.setAttribute('webkitdirectory','');dir.onchange=()=>processFiles(dir.files);
  m.append(card(el('p',{},(EN?'On iPhone, iPad, Safari and Firefox the app reads the photos you choose and builds a ':'Σε iPhone, iPad, Safari και Firefox η εφαρμογή διαβάζει όσες φωτογραφίες επιλέξεις και φτιάχνει '),el('b',{},(EN?'calendar and map':'ημερολόγιο και χάρτη')),(EN?'. It cannot copy or delete files — that only works with Chrome/Edge on a computer.':'. Δεν μπορεί να αντιγράψει ή να σβήσει αρχεία — αυτό γίνεται μόνο με Chrome/Edge σε υπολογιστή.')),
    el('div',{class:'row'},el('button',{class:'btn primary big',onclick:()=>inp.click()},icon('images'),(EN?'Choose photos':'Διάλεξε φωτογραφίες')),'webkitdirectory' in dir?el('button',{class:'btn big',onclick:()=>dir.click()},icon('folder-open'),(EN?'Choose a folder':'Διάλεξε φάκελο')):null),inp,dir));}

let LB=null;
function openLB(list,idx){LB={list,idx,tok:null,url:null};$('#lb').hidden=false;document.body.style.overflow='hidden';showLB();}
function closeLB(silent){if(!LB)return;if(LB.url)URL.revokeObjectURL(LB.url);LB=null;$('#lb').hidden=true;$('#lbMedia').innerHTML='';document.body.style.overflow='';}
function stepLB(d){if(!LB)return;LB.idx=(LB.idx+d+LB.list.length)%LB.list.length;showLB();}
async function showLB(){const {list,idx}=LB,p=list[idx],tok=LB.tok={};$('#lbCount').textContent=`${idx+1} / ${list.length}`;
  const media=$('#lbMedia');media.innerHTML='';if(LB.url){URL.revokeObjectURL(LB.url);LB.url=null;}
  $('#lbPrev').style.visibility=$('#lbNext').style.visibility=list.length>1?'visible':'hidden';renderLBInfo(p);
  $('#lbTrash').hidden=!FS_OK||!!p.viewOnly||!S.dests.length;$('#lbTrash').replaceChildren(icon(p.trashed?'undo-2':'trash-2'));$('#lbTrash').title=p.trashed?(EN?'Restore from Trash':'Επαναφορά από τον Κάδο'):(EN?'Delete from everywhere (goes to the Trash)':'Σβήσιμο από παντού (πάει στον Κάδο)');
  const tu=await thumbURL(p.h);if(!LB||tok!==LB.tok)return;
  if(p.video){const v=el('video',{controls:true,playsinline:true,poster:tu||null});media.append(v);const b=await photoBlob(p);if(!LB||tok!==LB.tok)return;if(b){LB.url=URL.createObjectURL(b);v.src=LB.url;}return;}
  const img=el('img',{src:tu||'',alt:''});media.append(img);
  const b=await photoBlob(p);if(!LB||tok!==LB.tok||!b)return;const u=URL.createObjectURL(b);const t=new Image();
  t.onload=()=>{if(LB&&tok===LB.tok){img.src=u;LB.url=u;}else URL.revokeObjectURL(u);};t.onerror=()=>URL.revokeObjectURL(u);t.src=u;}
function renderLBInfo(p){const info=$('#lbInfo');info.innerHTML='';
  const go=h=>()=>{closeLB();nav(h);};
  info.append(el('div',{class:'row'},el('b',{style:'font-size:18px'},(p.ds==='file'?'≈ ':'')+fmtDate(p.date,true)),
    p.date?el('button',{class:'link row',style:'gap:5px',onclick:go(`cal/${+p.date.slice(0,4)}/${+p.date.slice(5,7)}/${+p.date.slice(8,10)}`)},icon('calendar-days'),(EN?'whole day':'όλη η μέρα')):null,
    placeKey(p)?el('button',{class:'link row',style:'gap:5px',onclick:()=>{closeLB();navTo('place',placeKey(p));}},icon('map-pinned'),placeLabel(p)):null));
  for(const fl of p.files){
    if(fl.rel)info.append(el('div',{class:'path'},`💾 ${fl.rel}  `,S.dests.map(d=>(fl.v1&&fl.v1[d.id]?'✅':'⏳')).join(''),fl.v2?(EN?' · ✅✅ double-checked':' · ✅✅ διπλοελεγμένο'):(EN?' · ⏳ waiting for 2nd check':' · ⏳ περιμένει 2ο έλεγχο')));
    for(const s of fl.srcs)info.append(el('div',{class:'path'},(EN?`📍 original: ${srcLabel(s)}`:`📍 αρχικό: ${srcLabel(s)}`),s.deleted?(EN?' · 🗑️ deleted (a copy exists)':' · 🗑️ σβήστηκε (υπάρχει αντίγραφο)'):s.ok===true?' · ✅':s.ok===false?' · ⚠️ '+(s.why||''):''));
    for(const o of fl.origins||[])info.append(el('div',{class:'path'},'📍 '+o));}
  info.append(el('div',{class:'path'},(EN?`${p.name} · ${fmtSize(p.size)}${p.w?` · ${p.w}×${p.hgt}`:''}${p.ds==='file'?' · date from the file (approximate)':p.ds==='name'?' · date from the file name':''}`:`${p.name} · ${fmtSize(p.size)}${p.w?` · ${p.w}×${p.hgt}`:''}${p.ds==='file'?' · ημερομηνία από το αρχείο (κατά προσέγγιση)':p.ds==='name'?' · ημερομηνία από το όνομα':''}`)));}
$('#lbTrash').onclick=async()=>{if(!LB)return;const p=LB.list[LB.idx];if(!p)return;
  if(p.viewOnly)return toast((EN?'In view-only mode (iPhone/Safari) deleting is not possible.':'Σε προβολή μόνο (iPhone/Safari) δεν γίνεται σβήσιμο.'));
  closeLB();if(p.trashed)await restorePhotos([p]);else await trashPhotos([p]);};
$('#lbClose').onclick=()=>closeLB();$('#lbPrev').onclick=()=>stepLB(-1);$('#lbNext').onclick=()=>stepLB(1);
document.addEventListener('keydown',e=>{if(!LB)return;if(e.key==='Escape')closeLB();else if(e.key==='ArrowLeft')stepLB(-1);else if(e.key==='ArrowRight')stepLB(1);});
let tx0=null;$('#lbMedia').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;},{passive:true});
$('#lbMedia').addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)stepLB(dx<0?1:-1);});

/* ---------------- Εκκίνηση ---------------- */
(async()=>{
  if(!window.crypto||!crypto.subtle){$('#main').append(el('div',{class:'card bad'},(EN?'This browser lacks what is needed (Web Crypto). Use a recent Chrome, Edge or Safari.':'Ο browser δεν υποστηρίζει τα απαραίτητα (Web Crypto). Χρησιμοποίησε νέα έκδοση Chrome, Edge ή Safari.')));return;}
  if(!window.exifr)toast((EN?'⚠️ No internet: dates will come only from the file name/date. Open the app with a connection.':'⚠️ Χωρίς ίντερνετ: οι ημερομηνίες θα βγουν μόνο από το όνομα/ημερομηνία αρχείου. Άνοιξε την εφαρμογή με σύνδεση.'),8000);
  const shaOk=await selfTestSha();console.info('SHA256-selftest:'+shaOk);if(!shaOk)console.warn('SHA-256 self-test failed — μεγάλα αρχεία θα διαβάζονται ολόκληρα');
  await oneTab();await loadAll();render();
  try{if(localStorage.getItem(LSK('mnimes.afterSwitch'))){localStorage.removeItem(LSK('mnimes.afterSwitch'));toast(EN?'Now choose the other library in «② Where to?».':'Τώρα διάλεξε την άλλη βιβλιοθήκη στο «② Πού;».',8000);}}catch{}
  maybeInbox();
})();
</script>
