<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Ασφάλεια: η σελίδα επιτρέπεται να μιλήσει ΜΟΝΟ με αυτές τις διευθύνσεις (τίποτα άλλο δεν μπορεί να φορτωθεί ή να σταλεί αλλού) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https://server.arcgisonline.com https://cdnjs.cloudflare.com; media-src 'self' blob:; connect-src 'self' blob: data: https://api.bigdatacloud.net https://nominatim.openstreetmap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Μνήμες</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<!-- Κάθε εξωτερική βιβλιοθήκη έχει «σφραγίδα» (integrity): αν κάποιος την αλλάξει στο ίντερνετ, ο browser ΔΕΝ την τρέχει -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js" integrity="sha384-KrOocIA+lZcNUz2MDavnT/FuX+CbTREJihUi0bp8QUSwhE2AkGTNpv2b7yMbBkx5" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous"></script>
<style>
/* ---- Μνήμες · μοντέρνα, καθαρή εμφάνιση ---- */
:root{
  --bg:#f4f5f7;--card:#ffffff;--ink:#0e1014;--muted:#6b7280;--line:#e5e7eb;--soft:#eef0f4;--glass:rgba(255,255,255,.72);
  --accent:#5b5bf0;--accent-ink:#fff;--ok:#15935a;--warn:#c27012;--bad:#dc2f3a;
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#ec4899 100%);
  --shadow:0 1px 2px rgba(16,18,24,.04),0 8px 24px rgba(16,18,24,.06);--shadow-lg:0 20px 50px rgba(16,18,24,.16);
  --r:22px;--font:"Inter","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0b0f;--card:#14161c;--ink:#f3f4f6;--muted:#9aa1ad;--line:#252832;--soft:#1b1e26;--glass:rgba(20,22,28,.72);
  --accent:#8b8cff;--accent-ink:#0a0b0f;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--shadow:0 1px 0 rgba(255,255,255,.03);--shadow-lg:0 20px 50px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0a0b0f;--card:#14161c;--ink:#f3f4f6;--muted:#9aa1ad;--line:#252832;--soft:#1b1e26;--glass:rgba(20,22,28,.72);
  --accent:#8b8cff;--accent-ink:#0a0b0f;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--shadow:0 1px 0 rgba(255,255,255,.03);--shadow-lg:0 20px 50px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:140px;overflow-x:hidden;font-feature-settings:"cv11","ss01"}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.ico{display:inline-grid;place-items:center;flex:none;width:20px;height:20px}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* κεφαλίδα */
header{position:sticky;top:0;z-index:40;display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-left));
  background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 6px 16px rgba(139,92,246,.35)}
.logo .ico{width:19px;height:19px}
header h1{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#searchForm{flex:0 1 340px;min-width:0;position:relative}
#searchForm .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px;pointer-events:none}
#q{width:100%;padding:10px 14px 10px 40px;border-radius:999px;border:1px solid var(--line);background:var(--card);outline:none;transition:border-color .15s,box-shadow .15s}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s,transform .1s}
.hbtn:hover{background:var(--soft)}
.hbtn:active{transform:scale(.95)}
.hbtn.on{background:var(--bad);border-color:var(--bad);color:#fff}

main{max-width:1200px;margin:0 auto;padding:20px 16px}
h2{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:.1em 0 .25em}
h3{margin:.3em 0 .5em;font-weight:700;letter-spacing:-.015em}
.sec{margin:30px 0 12px;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:0 0 14px;box-shadow:var(--shadow)}
.card.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 6%,var(--card))}
.card.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 6%,var(--card))}
.card.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* κουμπιά */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:11px 20px;cursor:pointer;font-weight:600;letter-spacing:-.005em;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{box-shadow:0 8px 22px rgba(16,18,24,.22)}
.btn.big{font-size:17px;padding:15px 28px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn .ico{width:18px;height:18px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600}

/* αρχική */
.hello{margin:6px 0 18px}
.hello p{margin:0;font-size:17px}
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;gap:14px}
.btile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:26px;padding:18px;text-align:left;cursor:pointer;
  background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;isolation:isolate;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.btile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.btile:active{transform:scale(.98)}
.btile .bic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.btile .bic .ico{width:24px;height:24px}
.btile .btxt{display:flex;flex-direction:column;gap:2px}
.btile .btxt b{font-size:21px;letter-spacing:-.025em;line-height:1.15}
.btile .btxt small{color:var(--muted);font-size:14px}
.btile .barr{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted);transition:transform .25s}
.btile .barr .ico{width:17px;height:17px}
.btile:hover .barr{transform:rotate(45deg)}
.btile .cimg{position:absolute;inset:0;z-index:-2}
.btile .cimg img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.btile:hover .cimg img{transform:scale(1.05)}
.btile.photo{color:#fff;border:0;background:#1b1e26}
.btile.photo::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.65))}
.btile.photo .bic{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.btile.photo .btxt small{color:rgba(255,255,255,.85)}
.btile.photo .barr{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.b-org{grid-column:span 2;grid-row:span 2;background:var(--grad);color:#fff;border:0;padding:26px}
.b-org .bic{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.2);color:#fff}
.b-org .bic .ico{width:30px;height:30px}
.b-org .btxt b{font-size:clamp(26px,3.2vw,36px);letter-spacing:-.035em}
.b-org .btxt small{color:rgba(255,255,255,.88);font-size:16px;max-width:34ch}
.b-org .barr{background:rgba(255,255,255,.2);color:#fff;width:44px;height:44px;right:22px;top:22px}
.b-org::before{content:"";position:absolute;inset:auto -20% -45% 30%;height:90%;z-index:-1;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent);filter:blur(10px)}
.b-photos{grid-column:span 2}
.b-map,.b-more{grid-column:span 2}
@media (max-width:760px){
  .bento{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px;gap:10px}
  .b-org{grid-row:span 1}
  .b-org,.b-photos{grid-column:span 2}
  .b-map,.b-more{grid-column:span 1}
  .btile{padding:14px;border-radius:22px}
  .btile .btxt b{font-size:18px}
  .b-org{padding:18px}.b-org .btxt small{font-size:14px}
}

/* κάρτες «Προχωρημένες» */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c,var(--accent)) 40%,var(--line))}
.tile .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent))}
.tile .ic .ico{width:24px;height:24px}
.tile .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.tile .tt b{font-size:16px;letter-spacing:-.01em}
.tile .tt small{color:var(--muted);font-size:13.5px}
.tile .chev{color:var(--muted)}

/* εξώφυλλα (ημερολόγιο, μέρη) */
.tiles.cover{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ctile{position:relative;border:0;padding:0;border-radius:20px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;background:var(--soft);text-align:left;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.ctile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ctile.off{opacity:.35;cursor:default;transform:none;box-shadow:none}
.ctile .cimg{position:absolute;inset:0}
.ctile .cimg img{width:100%;height:100%;object-fit:cover}
.ctile .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;display:flex;flex-direction:column}
.ctile .cap b{font-size:20px;letter-spacing:-.02em}
.ctile .cap small{opacity:.88}

/* πλέγμα φωτογραφιών */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px}
.thumb{position:relative;aspect-ratio:1;background:var(--soft);border-radius:10px;overflow:hidden;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.thumb:hover img{transform:scale(1.04)}
.thumb.noimg{background:linear-gradient(135deg,var(--soft),color-mix(in srgb,var(--soft) 70%,var(--line)))}
.badge{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.badge .ico{width:12px;height:12px}
.badge .ico svg{fill:currentColor}
.thumb.sel{outline:4px solid var(--bad);outline-offset:-4px}
.thumb.sel::before{content:"✓";position:absolute;left:6px;top:6px;z-index:2;width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-weight:800}
body.selecting .thumb{cursor:copy}

.stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 18px}
.stepper b{font-size:24px;min-width:200px;text-align:center;letter-spacing:-.025em}
.stepper .btn{width:46px;height:46px;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:820px;margin:0 auto}
.cal .wd{text-align:center;color:var(--muted);font-size:13px;font-weight:600}
.day{position:relative;aspect-ratio:1;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow:hidden;padding:0;cursor:default}
.day.has{cursor:pointer;border-color:transparent}
.day .n{position:absolute;left:7px;top:5px;font-weight:700;font-size:15px;z-index:2}
.day.has .n{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.day .cimg{position:absolute;inset:0}
.day .cimg img{width:100%;height:100%;object-fit:cover}
.day .badge{z-index:2}
.day.today{outline:3px solid var(--accent);outline-offset:-1px}

input[type=text],input[type=date],input[type=number],select{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
label.chk{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}
label.chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.locks{list-style:none;padding:0;margin:0}
.locks li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.locks li:last-child{border:0}
.locks .ic{flex:none;width:28px;text-align:center}
pre,code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:13.5px}
pre{background:var(--soft);padding:14px;border-radius:14px;overflow:auto;white-space:pre}
.tree{line-height:1.4}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:13px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:28px;letter-spacing:-.03em;font-weight:800}
.kpi span{color:var(--muted);font-size:13.5px}
.list .item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.list .item .thumb{width:90px;flex:none}
.path{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px;word-break:break-all;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}

/* χάρτης */
#map{height:min(62vh,560px);border-radius:var(--r);margin-bottom:18px;border:1px solid var(--line);z-index:0;box-shadow:var(--shadow);background:var(--soft)}
.pmk{background:none;border:0}
.pmk-in{position:relative;box-sizing:border-box;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.35);background:#8b5cf6 center/cover no-repeat;transition:transform .15s}
.pmk-in:hover{transform:scale(1.12)}
.pmk-in b{position:absolute;right:-2px;bottom:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#111;color:#fff;font:700 12px/22px var(--font);text-align:center;border:2px solid #fff}
.leaflet-container{font-family:var(--font)}

/* προβολή φωτογραφίας */
#lb{position:fixed;inset:0;z-index:100;background:rgba(6,7,10,.97);color:#f3f4f6;display:flex;flex-direction:column}
#lb[hidden]{display:none}
.lbtop{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
.lbtop .hbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff}
.lbtop .hbtn:hover{background:rgba(255,255,255,.16)}
.lbstage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
#lbMedia{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#lbMedia img,#lbMedia video{max-width:100%;max-height:100%;object-fit:contain}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);color:#fff;width:52px;height:52px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.lbnav:hover{background:rgba(255,255,255,.2)}
.lbnav .ico{width:26px;height:26px}
#lbPrev{left:14px} #lbNext{right:14px}
#lbInfo{padding:12px 16px 18px;max-height:34vh;overflow:auto;font-size:15px;border-top:1px solid rgba(255,255,255,.08)}
#lbInfo .path{color:#a3a9b5}
#lbInfo .link{color:#a5a6ff}

/* πρόοδος */
#prog{position:fixed;left:0;right:0;bottom:0;z-index:90;padding:0 12px 12px;pointer-events:none}
#prog[hidden]{display:none}
#prog .pin{pointer-events:auto;max-width:900px;margin:0 auto;background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border:1px solid var(--line);border-radius:22px;padding:16px 18px;box-shadow:var(--shadow-lg)}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:999px;transition:width .3s}
#progNote{font-weight:700;color:var(--warn);margin:4px 0}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;max-width:min(92vw,560px);display:none;font-weight:600;box-shadow:var(--shadow-lg)}
#banner .card{margin:14px auto 0;max-width:1168px}
#banner{padding:0 16px}
#selbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:95;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
  background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border:1px solid var(--line);border-radius:22px;padding:10px 14px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 24px)}
#selbar[hidden]{display:none}
#selCount{font-weight:700;padding:0 6px}

@media (max-width:600px){
  body{font-size:15.5px}
  header h1{display:none}
  .brand{flex:0 0 auto}
  #searchForm{flex:1 1 auto}
  .tiles.cover{grid-template-columns:repeat(2,1fr);gap:10px}
  .grid{grid-template-columns:repeat(3,1fr);gap:3px}
  .stepper b{min-width:0;font-size:19px}
  .cal{gap:3px}
  .day{border-radius:10px}
  .day .n{font-size:12px}
  .lbnav{width:42px;height:42px}
}
</style>
</head>
<body>
<header>

const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,

    if(this.bl){const n=Math.min(64-this.bl,d.length);this.buf.set(d.subarray(0,n),this.bl);this.bl+=n;i=n;if(this.bl===64){this.block(this.buf,0);this.bl=0;}}

    for(let t=0;t<64;t++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));const ch=(e&f)^(~e&g);const t1=(h+S1+ch+K[t]+w[t])|0;

  const hs=new Sha256();hs.update(d.subarray(0,Math.floor(n/3)));hs.update(d.subarray(Math.floor(n/3)));if(hs.hex()!==await sha256(d))throw 0;}return true;}catch{BIG=Infinity;return false;}}

/* ---------------- IndexedDB (μνήμη εφαρμογής) ---------------- */
let _db=null;
function idb(){if(_db)return _db;_db=new Promise((res,rej)=>{const r=indexedDB.open('mnimes',1);
  r.onupgradeneeded=()=>{const d=r.result;for(const s of ['kv','photos','thumbs','faces','chips','persons'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s);};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});return _db;}
async function tx(store,mode,fn){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const req=fn(t.objectStore(store));
  t.oncomplete=()=>res(req&&req.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const dbGet=(s,k)=>tx(s,'readonly',o=>o.get(k)).catch(()=>undefined);
const dbPut=(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k)).catch(e=>console.warn('idb',e));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k)).catch(()=>{});
const dbAll=s=>tx(s,'readonly',o=>o.getAll()).catch(()=>[]);
const savePhoto=p=>dbPut('photos',p.h,p);
const saveSources=()=>dbPut('kv','sources',S.sources);
const saveDests=()=>dbPut('kv','dests',S.dests);
async function loadAll(){
  try{
    Object.assign(S.settings,(await dbGet('kv','settings'))||{});
    S.sources=(await dbGet('kv','sources'))||[];
    S.dests=(await dbGet('kv','dests'))||[];
    S.geo=(await dbGet('kv','geo'))||{};
    S.log=(await dbGet('kv','log'))||[];
    S.deletions=(await dbGet('kv','deletions'))||[];
    for(const p of await dbAll('photos'))S.photos.set(p.h,p);
    for(const f of await dbAll('faces'))S.faces.set(f.id,f);
    for(const p of await dbAll('persons'))S.persons.set(p.id,p);
  }catch(e){console.warn(e);}
  rebuildSrcIndex();S.ver++;S.fver++;
}
function rebuildSrcIndex(){S.srcIndex.clear();for(const p of S.photos.values())for(const fl of p.files||[])for(const s of fl.srcs||[])S.srcIndex.add(s.s+'|'+s.p.join('/'));}

/* ---------------- Αρχεία (File System Access API) ---------------- */
async function permState(h,mode='read'){if(!h)return 'denied';try{return await h.queryPermission({mode});}catch{return 'denied';}}
async function ensurePerm(h,mode='read'){if(!h)return false;if(await permState(h,mode)==='granted')return true;try{return (await h.requestPermission({mode}))==='granted';}catch{return false;}}
async function dirAt(root,segs,create=false){let d=root;for(const s of segs)d=await d.getDirectoryHandle(s,{create});return d;}
async function fileHandleAt(root,segs,create=false){const d=await dirAt(root,segs.slice(0,-1),create);return d.getFileHandle(segs[segs.length-1],{create});}
async function writeRel(root,rel,blob){const fh=await fileHandleAt(root,rel.split('/'),true);const w=await fh.createWritable();
  try{await w.write(blob);await w.close();}catch(e){try{await w.abort();}catch{}throw e;}}
async function readRel(root,rel){return (await fileHandleAt(root,rel.split('/'))).getFile();}
async function relExists(root,rel){try{await fileHandleAt(root,rel.split('/'));return true;}catch{return false;}}
async function hasDir(dir,name){try{await dir.getDirectoryHandle(name);return true;}catch{return false;}}
/* Διάβασε + αποτύπωμα, με 3 προσπάθειες. Μικρά αρχεία: μία ανάγνωση στη μνήμη. Μεγάλα (βίντεο): σε κομμάτια, χωρίς να γεμίσει η μνήμη. */
async function readHashed(getFile,tries=3){let last;for(let i=0;i<tries;i++){try{const f=await getFile();
  if(f.size>=BIG)return {f,buf:null,h:await hashFile(f)};const buf=await f.arrayBuffer();return {f,buf,h:await sha256(buf)};}
  catch(e){last=e;if(e&&e.name==='NotFoundError')break;await sleep(400*(i+1));}}throw last;}
/* Πραγματικός έλεγχος χώρου: «κλείνει» προσωρινά αρχείο όσο ο χώρος που χρειάζεται και μετά το σβήνει */
async function checkSpace(d,bytes){const name='.xoros-'+Date.now()+'.tmp';let res=null;
  try{const fh=await fileHandleAt(d.handle,[META,name],true);const w=await fh.createWritable();
    try{await w.truncate(Math.ceil(bytes));await w.close();res=true;}catch(e){try{await w.abort();}catch{}throw e;}}
  catch(e){res=isFull(e)?false:null;if(res===null)logErr((EN?'The space check did not finish':'Ο έλεγχος χώρου δεν ολοκληρώθηκε'),e);}
  try{await (await d.handle.getDirectoryHandle(META)).removeEntry(name);}catch{}
  return res;}
function isFull(e){return e&&(e.name==='QuotaExceededError'||/no space|disk full|quota|not enough space/i.test(e.message||''));}

/* ---------------- Μεταδεδομένα: ημερομηνία & τοποθεσία ---------------- */
function dateToIso(d){
  if(typeof d==='string'){const m=d.match(/^(\d{4})[:-](\d\d)[:-](\d\d)[ T](\d\d):(\d\d):(\d\d)/);if(!m)return null;d=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]);}
  if(!(d instanceof Date)||isNaN(d))return null;const y=d.getFullYear();if(y<1971||y>new Date().getFullYear()+1)return null;
  return `${y}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;}
function dateFromName(name){
  const m=name.match(/(19[89]\d|20[0-4]\d)[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])(?:[-_ T]?([01]\d|2[0-3])[-_.:]?([0-5]\d)[-_.:]?([0-5]\d))?/);
  if(!m)return null;const d=new Date(+m[1],m[2]-1,+m[3],+(m[4]||12),+(m[5]||0),+(m[6]||0));
  if(d.getMonth()!==m[2]-1)return null;return dateToIso(d);}
async function readMeta(buf,name,lastMod,isVideo){
  let date=null,ds=null,lat=null,lon=null;
  if(!isVideo&&window.exifr){try{
    const x=await exifr.parse(buf,{tiff:true,exif:true,gps:true,xmp:false,icc:false,iptc:false,jfif:false,ihdr:false,ifd1:false,mergeOutput:true,reviveValues:true});
    if(x){const iso=dateToIso(x.DateTimeOriginal||x.CreateDate||x.DateTimeDigitized||x.ModifyDate);if(iso){date=iso;ds='exif';}
      if(typeof x.latitude==='number'&&typeof x.longitude==='number'&&isFinite(x.latitude)&&isFinite(x.longitude)&&!(x.latitude===0&&x.longitude===0)){lat=+x.latitude.toFixed(6);lon=+x.longitude.toFixed(6);}}
  }catch(e){}}
  if(!date){const iso=dateFromName(name);if(iso){date=iso;ds='name';}}
  if(!date&&S.settings.fileDate&&lastMod){const iso=dateToIso(new Date(lastMod));if(iso){date=iso;ds='file';}}
  return {date,ds,lat,lon};}
let geoLast=0;
function cleanPlace(n){return n?String(n).replace(/^(Δήμος|Δημοτική Ενότητα|Περιφερειακή Ενότητα|Municipality of|Municipal Unit of)\s+/i,'').trim():null;}
async function placeName(lat,lon){
  const key=lat.toFixed(2)+','+lon.toFixed(2);
  if(key in S.geo)return S.geo[key];
  if(!S.settings.geocode||!navigator.onLine)return null;
  const wait=geoLast+700-Date.now();if(wait>0)await sleep(wait);geoLast=Date.now();
  let name=null;lat=lat.toFixed(2);lon=lon.toFixed(2); // ιδιωτικότητα: στέλνεται μόνο η περιοχή (~1 χλμ), όχι το ακριβές σημείο
  try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${EN?'en':'el'}`,{referrerPolicy:'no-referrer',credentials:'omit'});
    if(r.ok){const j=await r.json();name=cleanPlace(j.city||j.locality||j.principalSubdivision||j.countryName);}}catch(e){}
  if(!name){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=${EN?'en':'el'}&lat=${lat}&lon=${lon}`,{referrerPolicy:'no-referrer',credentials:'omit'});
    if(r.ok){const a=(await r.json()).address||{};name=cleanPlace(a.village||a.town||a.city||a.municipality||a.island||a.county||a.state||a.country);}await sleep(1000);}catch(e){}}
  if(name){S.geo[key]=name;clearTimeout(placeName.t);placeName.t=setTimeout(()=>dbPut('kv','geo',S.geo),1500);}
  return name;}
function placeKey(p){return p.place?'n:'+p.place:(p.lat!=null?'c:'+p.lat.toFixed(1)+','+p.lon.toFixed(1):null);}
function placeLabel(p){return p.place||(p.lat!=null?`📍 ${p.lat.toFixed(1)}, ${p.lon.toFixed(1)}`:'');}
/* Τα ονόματα φακέλων είναι ΠΑΝΤΑ ελληνικά, σε όποια γλώσσα κι αν είναι η εφαρμογή (για να μένει ίδια η βιβλιοθήκη) */
const FOLDER_MONTHS=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
function folderFor(p){if(!p.date)return 'Χωρίς ημερομηνία';const y=p.date.slice(0,4),m=+p.date.slice(5,7);let f=`${y}/${pad(m)}-${FOLDER_MONTHS[m-1]}`;if(p.place)f+='/'+safeName(p.place);return f;}

/* ---------------- Μικρογραφίες ---------------- */
async function decodeImage(blob,buf){
  try{return {bmp:await createImageBitmap(blob),full:true};}catch(e){}
  if(window.exifr&&buf){try{const t=await exifr.thumbnail(buf);if(t)return {bmp:await createImageBitmap(new Blob([t],{type:'image/jpeg'})),full:false};}catch(e){}}
  return null;}
/* Καμβάς → JPEG με ασφάλεια: toBlob, κι αν δεν απαντήσει σε 4" , εναλλακτικά toDataURL */
function canvasJpeg(c,q){return new Promise(res=>{let done=false;const fin=b=>{if(!done){done=true;res(b);}};
  try{c.toBlob(b=>fin(b),'image/jpeg',q);}catch{}
  setTimeout(()=>{if(done)return;try{const u=c.toDataURL('image/jpeg',q),s=atob(u.split(',')[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);fin(new Blob([a],{type:'image/jpeg'}));}catch{fin(null);}},4000);});}
function toJpeg(src,w,h,max,q=0.82){const sc=Math.min(1,max/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);return canvasJpeg(c,q);}
async function makeThumb(file,buf){const d=await decodeImage(file,buf);if(!d)return null;const blob=await toJpeg(d.bmp,d.bmp.width,d.bmp.height,420);
  const r={blob,w:d.bmp.width,h:d.bmp.height,dec:d.full};d.bmp.close&&d.bmp.close();return blob?r:null;}
function videoThumb(file){return new Promise(res=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';
  const url=URL.createObjectURL(file);let done=false;const fin=r=>{if(done)return;done=true;URL.revokeObjectURL(url);res(r);};
  v.onloadeddata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/2);}catch{fin(null);}};
  v.onseeked=async()=>{try{const b=await toJpeg(v,v.videoWidth,v.videoHeight,420);fin(b?{blob:b,w:v.videoWidth,h:v.videoHeight,dec:true}:null);}catch{fin(null);}};
  v.onerror=()=>fin(null);setTimeout(()=>fin(null),8000);v.src=url;});}
const thumbURLs=new Map(),chipURLs=new Map();
/* Οι εικόνες μπαίνουν στη μνήμη του browser ως σκέτα bytes (πιο αξιόπιστο από Blob, ειδικά όταν η σελίδα ανοίγει ως αρχείο) */
async function putBin(store,key,blob){try{await dbPut(store,key,{t:blob.type||'image/jpeg',b:await blob.arrayBuffer()});}catch(e){console.warn(e);}}
async function getBin(store,key){const v=await dbGet(store,key);if(!v)return null;if(v instanceof Blob)return v;return v.b?new Blob([v.b],{type:v.t||'image/jpeg'}):null;}
async function storeThumb(h,blob){await putBin('thumbs',h,blob);if(thumbURLs.has(h))URL.revokeObjectURL(thumbURLs.get(h));thumbURLs.set(h,URL.createObjectURL(blob));}
async function cachedBlobURL(map,store,key,rel){
  if(map.has(key))return map.get(key);
  let b=await getBin(store,key);
  if(!b){for(const d of S.dests){if(d.handle&&await permState(d.handle)==='granted'){try{b=await readRel(d.handle,rel);putBin(store,key,b);break;}catch{}}}}
  if(!b)return null;const u=URL.createObjectURL(b);map.set(key,u);return u;}
const thumbURL=h=>cachedBlobURL(thumbURLs,'thumbs',h,`${META}/thumbs/${h}.jpg`);
const chipURL=id=>cachedBlobURL(chipURLs,'chips',id,`${META}/faces/${id}.jpg`);
const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){io.unobserve(e.target);fillImg(e.target);}},{rootMargin:'500px'});
async function fillImg(div){const u=div.dataset.chip?await chipURL(div.dataset.chip):await thumbURL(div.dataset.h);
  if(u)div.prepend(el('img',{src:u,alt:'',decoding:'async'}));else div.classList.add('noimg');}
function lazy(div,{h,chip}){if(h)div.dataset.h=h;if(chip)div.dataset.chip=chip;io.observe(div);return div;}

/* Πλήρης εικόνα: από μνήμη → βιβλιοθήκη → αρχική θέση */
async function photoBlob(p){
  if(S.mem.has(p.h))return S.mem.get(p.h);
  const mf=p.files[0];
  if(mf.rel)for(const d of S.dests){if(d.handle&&await permState(d.handle)==='granted'){try{return await readRel(d.handle,(p.trashed?TRASH+'/':'')+mf.rel);}catch{}}}
  for(const src of mf.srcs||[]){if(src.deleted)continue;const s=S.sources[src.s];if(s&&s.handle&&await permState(s.handle)==='granted'){try{return await (await fileHandleAt(s.handle,src.p)).getFile();}catch{}}}
  return null;}

/* ---------------- ΚΑΔΟΣ: σβήσιμο φωτογραφίας/βίντεο ΑΠΟ ΠΑΝΤΟΥ, με επαναφορά ----------------
   1) Ένα επαληθευμένο αντίγραφο μπαίνει στον Κάδο (μέσα στη βιβλιοθήκη, σε κάθε δίσκο της).
   2) ΜΟΝΟ αφού επαληθευτεί, σβήνεται από τη βιβλιοθήκη, το 2ο αντίγραφο και ΟΛΕΣ τις αρχικές θέσεις.
   3) Οριστικά χάνεται μόνο όταν αδειάσεις τον Κάδο. */
const TRASH=META+'/Κάδος';
async function removeRel(root,segs){const dir=await dirAt(root,segs.slice(0,-1));await dir.removeEntry(segs[segs.length-1]);}
async function goodCopy(p,fl,fromTrash){ // βρες ένα αντίγραφο με ΣΩΣΤΟ αποτύπωμα
  for(const d of S.dests){try{const f=await readRel(d.handle,(fromTrash?TRASH+'/':'')+fl.rel);if(f.size===fl.size&&await hashFile(f)===fl.h)return f;}catch{}}
  for(const src of fl.srcs){if(src.deleted)continue;const s=S.sources[src.s];if(!s||!s.handle)continue;try{const f=await (await fileHandleAt(s.handle,src.p)).getFile();if(f.size===fl.size&&await hashFile(f)===fl.h)return f;}catch{}}
  return null;}
async function trashPhotos(list){
  list=list.filter(p=>p&&!p.trashed&&!p.viewOnly);if(!list.length)return;
  for(const d of S.dests)if(!await ensurePerm(d.handle,'readwrite'))return toast((EN?'Permission needed for the library «':'Χρειάζεται άδεια για τη βιβλιοθήκη «')+d.name+'».');
  const srcIds=new Set();for(const p of list)for(const fl of p.files)for(const s of fl.srcs)if(!s.deleted&&!s.prot)srcIds.add(s.s);
  const missing=[];for(const i of srcIds){const s=S.sources[i];if(!s||!s.handle||s.removed||!await ensurePerm(s.handle,'readwrite'))missing.push(s?s.name:'?');}
  const nv=list.filter(p=>p.video).length,what=(EN?`${list.length-nv?fmtN(list.length-nv)+' photo'+(list.length-nv===1?'':'s'):''}${list.length-nv&&nv?' and ':''}${nv?fmtN(nv)+' video'+(nv===1?'':'s'):''}`:`${list.length-nv?fmtN(list.length-nv)+' φωτογραφί'+(list.length-nv===1?'α':'ες'):''}${list.length-nv&&nv?' και ':''}${nv?fmtN(nv)+' βίντεο':''}`);
  if(!confirm((EN?`🗑️ Delete ${what} FROM EVERYWHERE?\n\n• from the «Μνήμες» library (and the 2nd copy)\n• from ALL original locations (including OneDrive/cloud → also deleted from your other devices)\n\nThey go to the 🗑️ Trash: you can restore them until you empty it.`:`🗑️ Να σβηστ${list.length===1?'εί':'ούν'} ${what} ΑΠΟ ΠΑΝΤΟΥ;\n\n• από τη βιβλιοθήκη «Μνήμες» (και το 2ο αντίγραφο)\n• από ΟΛΕΣ τις αρχικές θέσεις (και OneDrive/cloud → σβήνεται και από τις άλλες συσκευές)\n\nΠάνε στον 🗑️ Κάδο: μπορείς να τα επαναφέρεις, μέχρι να τον αδειάσεις.`)+
    (missing.length?(EN?`\n\n⚠️ I can’t reach: ${missing.join(', ')} (maybe a disconnected drive). Nothing will be deleted from there.`:`\n\n⚠️ Δεν έχω πρόσβαση σε: ${missing.join(', ')} (ίσως αποσυνδεδεμένος δίσκος). Από εκεί ΔΕΝ θα σβηστούν.`):'')))return;
  const run=newRun((EN?'🗑️ To Trash':'🗑️ Στον Κάδο'));if(!run)return;run.total=list.length;run.lines={[EN?'To Trash':'Στον Κάδο']:0,[EN?'Originals deleted':'Αρχικά σβήστηκαν']:0,[EN?'Skipped (for safety)':'Παραλείφθηκαν (για ασφάλεια)']:0};
  for(const p of list){await run.wait();if(run.stop)break;
    try{ // Βήμα 1: επαληθευμένο αντίγραφο στον Κάδο για ΚΑΘΕ αρχείο (RAW, Live, XMP μαζί)
      for(const fl of p.files){if(!fl.rel)throw new Error((EN?'not copied to the library yet':'δεν έχει αντιγραφεί ακόμα στη βιβλιοθήκη'));
        const good=await goodCopy(p,fl,false);if(!good)throw new Error((EN?'no correct copy found: ':'δεν βρέθηκε σωστό αντίγραφο: ')+fl.rel);let saved=0;
        for(const d of S.dests){try{const tr=`${TRASH}/${fl.rel}`;if(!(await relExists(d.handle,tr))||await hashFile(await readRel(d.handle,tr))!==fl.h)await writeRel(d.handle,tr,new Blob([good]));
          const back=await readRel(d.handle,tr);if(back.size===fl.size&&await hashFile(back)===fl.h)saved++;}catch(e){if(isFull(e))throw new Error((EN?'the drive is full':'γέμισε ο δίσκος'));}}
        if(!saved)throw new Error((EN?'the copy in the Trash could not be verified: ':'δεν επαληθεύτηκε το αντίγραφο στον Κάδο: ')+fl.rel);}
      // Βήμα 2: σβήσιμο από βιβλιοθήκη + αρχικές θέσεις
      const srcDel=[];
      for(const fl of p.files){for(const d of S.dests){try{await removeRel(d.handle,fl.rel.split('/'));}catch{}}
        for(const src of fl.srcs){if(src.deleted||src.prot)continue;const s=S.sources[src.s];if(!s||!s.handle||await permState(s.handle,'readwrite')!=='granted')continue;
          try{const fh=await fileHandleAt(s.handle,src.p);const f=await fh.getFile();
            if(f.size!==fl.size||await hashFile(f)!==fl.h){logErr((EN?'Not deleted (the original changed): ':'Δεν σβήστηκε (άλλαξε το αρχικό): ')+srcLabel(src));continue;}
            let same=false;for(const d of S.dests){try{if(await fh.isSameEntry(await fileHandleAt(d.handle,`${TRASH}/${fl.rel}`.split('/'))))same=true;}catch{}}if(same)continue;
            await removeRel(s.handle,src.p);src.deleted=Date.now();src.trashed=true;srcDel.push({s:src.s,p:src.p,h:fl.h,rel:fl.rel});run.lines[(EN?'Originals deleted':'Αρχικά σβήστηκαν')]++;}
          catch(e){if(e.name!=='NotFoundError')logErr((EN?'Not deleted: ':'Δεν σβήστηκε: ')+srcLabel(src),e);}}}
      p.trashed=Date.now();p.trashSrc=srcDel;await savePhoto(p);run.lines[(EN?'To Trash':'Στον Κάδο')]++;}
    catch(e){run.lines[(EN?'Skipped (for safety)':'Παραλείφθηκαν (για ασφάλεια)')]++;logErr((EN?'Did not go to the Trash: ':'Δεν πήγε στον Κάδο: ')+p.name,e);}
    run.i++;updProg();}
  rebuildSrcIndex();S.ver++;S.fver++;await saveIndex();
  endRun(run,(EN?`✅ ${fmtN(run.lines[(EN?'To Trash':'Στον Κάδο')])} went to the 🗑️ Trash (and ${fmtN(run.lines[(EN?'Originals deleted':'Αρχικά σβήστηκαν')])} originals were deleted). Changed your mind? Home → Advanced → Trash → Restore.`:`✅ ${fmtN(run.lines['Στον Κάδο'])} πήγαν στον 🗑️ Κάδο (σβήστηκαν και ${fmtN(run.lines['Αρχικά σβήστηκαν'])} αρχικά). Αν το μετάνιωσες: Αρχική → Κάδος → Επαναφορά.`));}
async function restorePhotos(list){
  list=list.filter(p=>p&&p.trashed&&!p.purged);if(!list.length)return;
  for(const d of S.dests)if(!await ensurePerm(d.handle,'readwrite'))return toast((EN?'Permission needed for the library «':'Χρειάζεται άδεια για τη βιβλιοθήκη «')+d.name+'».');
  const sIds=new Set(list.flatMap(p=>(p.trashSrc||[]).map(e=>e.s)));for(const i of sIds){const s=S.sources[i];if(s&&s.handle&&!s.removed)await ensurePerm(s.handle,'readwrite');}
  const run=newRun((EN?'↩️ Restore from Trash':'↩️ Επαναφορά από τον Κάδο'));if(!run)return;run.total=list.length;run.lines={[EN?'Restored':'Επαναφέρθηκαν']:0,[EN?'Originals put back':'Αρχικά ξαναμπήκαν στη θέση τους']:0,[EN?'Problems':'Προβλήματα']:0};
  for(const p of list){await run.wait();if(run.stop)break;
    try{for(const fl of p.files){const good=await goodCopy(p,fl,true);if(!good)throw new Error((EN?'not found in the Trash: ':'δεν βρέθηκε στον Κάδο: ')+fl.rel);
        for(const d of S.dests){if(await relExists(d.handle,fl.rel)){if(await hashFile(await readRel(d.handle,fl.rel))!==fl.h)throw new Error((EN?'another file already exists: ':'υπάρχει ήδη άλλο αρχείο: ')+fl.rel);}
          else await writeRel(d.handle,fl.rel,new Blob([good]));if(await hashFile(await readRel(d.handle,fl.rel))!==fl.h)throw new Error((EN?'the restore could not be verified':'η επαναφορά δεν επαληθεύτηκε'));}
        for(const e of (p.trashSrc||[]).filter(e=>e.h===fl.h)){const s=S.sources[e.s];if(!s||!s.handle||await permState(s.handle,'readwrite')!=='granted'){logErr((EN?'The original was not put back (no permission): ':'Το αρχικό δεν ξαναμπήκε (χωρίς άδεια): ')+(s?s.name:'?')+'/'+e.p.join('/'));continue;}
          try{let exists=false;try{await fileHandleAt(s.handle,e.p);exists=true;}catch{}
            if(!exists){await writeRel(s.handle,e.p.join('/'),new Blob([good]));}
            if(await hashFile(await (await fileHandleAt(s.handle,e.p)).getFile())===fl.h){const src=fl.srcs.find(x=>x.s===e.s&&x.p.join('/')===e.p.join('/'));if(src){delete src.deleted;delete src.trashed;src.ok=true;}e.done=true;run.lines[(EN?'Originals put back':'Αρχικά ξαναμπήκαν στη θέση τους')]++;}}
          catch(x){logErr((EN?'The original was not put back: ':'Το αρχικό δεν ξαναμπήκε: ')+s.name+'/'+e.p.join('/'),x);}}}
      for(const fl of p.files)for(const d of S.dests){try{await removeRel(d.handle,`${TRASH}/${fl.rel}`.split('/'));}catch{}}
      p.trashSrc=(p.trashSrc||[]).filter(e=>!e.done);delete p.trashed;await savePhoto(p);run.lines[(EN?'Restored':'Επαναφέρθηκαν')]++;}
    catch(e){run.lines[(EN?'Problems':'Προβλήματα')]++;logErr((EN?'Restore failed: ':'Επαναφορά απέτυχε: ')+p.name,e);}
    run.i++;updProg();}
  rebuildSrcIndex();S.ver++;S.fver++;await saveIndex();
  endRun(run,(EN?`✅ Restored ${fmtN(run.lines[(EN?'Restored':'Επαναφέρθηκαν')])} (and ${fmtN(run.lines[(EN?'Originals put back':'Αρχικά ξαναμπήκαν στη θέση τους')])} originals put back in place).`:`✅ Επαναφέρθηκαν ${fmtN(run.lines['Επαναφέρθηκαν'])} (και ${fmtN(run.lines['Αρχικά ξαναμπήκαν στη θέση τους'])} αρχικά στη θέση τους).`));}
async function emptyTrash(){const list=[...S.photos.values()].filter(p=>p.trashed&&!p.purged);if(!list.length)return;
  if(prompt((EN?`⚠️ PERMANENT deletion of ${fmtN(list.length)} files from the Trash. They can NEVER come back.\nType: EMPTY`:`⚠️ ΟΡΙΣΤΙΚΟ σβήσιμο ${fmtN(list.length)} αρχείων από τον Κάδο. Δεν γυρίζουν πίσω ΠΟΤΕ.\nΓράψε: ΑΔΕΙΑΣΜΑ`))!==(EN?'EMPTY':'ΑΔΕΙΑΣΜΑ'))return;
  for(const d of S.dests)if(!await ensurePerm(d.handle,'readwrite'))return toast((EN?'Permission needed for the library «':'Χρειάζεται άδεια για τη βιβλιοθήκη «')+d.name+'».');
  const run=newRun((EN?'🗑️ Emptying the Trash':'🗑️ Άδειασμα Κάδου'));if(!run)return;run.total=list.length;run.lines={[EN?'Permanently deleted':'Σβήστηκαν οριστικά']:0};
  for(const p of list){for(const fl of p.files)for(const d of S.dests){try{await removeRel(d.handle,`${TRASH}/${fl.rel}`.split('/'));}catch{}}
    // και η μικρογραφία και τα πρόσωπα — να μη μείνει ίχνος
    dbDel('thumbs',p.h);if(thumbURLs.has(p.h)){URL.revokeObjectURL(thumbURLs.get(p.h));thumbURLs.delete(p.h);}
    for(const d of S.dests){try{await removeRel(d.handle,[META,'thumbs',p.h+'.jpg']);}catch{}}
    for(const f of [...S.faces.values()].filter(f=>f.h===p.h)){S.faces.delete(f.id);dbDel('faces',f.id);dbDel('chips',f.id);for(const d of S.dests){try{await removeRel(d.handle,[META,'faces',f.id+'.jpg']);}catch{}}
      const pr=S.persons.get(f.person);if(pr){recomputePerson(pr);if(!pr.count){S.persons.delete(pr.id);dbDel('persons',pr.id);}else dbPut('persons',pr.id,pr);}}
    S.fver++;p.purged=Date.now();await savePhoto(p);run.lines[(EN?'Permanently deleted':'Σβήστηκαν οριστικά')]++;run.i++;updProg();}
  S.ver++;await saveIndex();endRun(run,(EN?`✅ The Trash is empty (${fmtN(run.lines[(EN?'Permanently deleted':'Σβήστηκαν οριστικά')])}).`:`✅ Ο Κάδος άδειασε (${fmtN(run.lines['Σβήστηκαν οριστικά'])}).`));}

let IDX=null,IDXV=-1,FIDX=null,FIDXV=-1;
function getIdx(){if(IDX&&IDXV===S.ver)return IDX;
  const all=[...S.photos.values()].filter(p=>!p.trashed).sort(cmpDate);const days=new Map(),months=new Map(),years=new Map(),places=new Map(),nodate=[];
  const push=(m,k,v)=>{let a=m.get(k);if(!a)m.set(k,a=[]);a.push(v);};
  for(const p of all){
    if(!p.date)nodate.push(p);else{push(days,p.date.slice(0,10),p);push(months,p.date.slice(0,7),p);const y=+p.date.slice(0,4);years.set(y,(years.get(y)||0)+1);}
    const k=placeKey(p);if(k){let pl=places.get(k);if(!pl)places.set(k,pl={key:k,name:placeLabel(p),list:[],lat:0,lon:0,n:0});pl.list.push(p);if(p.lat!=null){pl.lat+=p.lat;pl.lon+=p.lon;pl.n++;}}}
  for(const pl of places.values())if(pl.n){pl.lat/=pl.n;pl.lon/=pl.n;}
  const ys=[...years.keys()].sort((a,b)=>a-b);
  IDX={all,days,months,years,places,nodate,dayKeys:[...days.keys()].sort(),minYear:ys[0],maxYear:ys[ys.length-1]};IDXV=S.ver;return IDX;}
function getFaceIdx(){if(FIDX&&FIDXV===S.fver)return FIDX;const byPhoto=new Map(),byPerson=new Map();
  for(const f of S.faces.values()){const fp=S.photos.get(f.h);if(fp&&fp.trashed)continue;let a=byPhoto.get(f.h);if(!a)byPhoto.set(f.h,a=[]);a.push(f);if(f.person){let b=byPerson.get(f.person);if(!b)byPerson.set(f.person,b=[]);b.push(f);}}
  FIDX={byPhoto,byPerson};FIDXV=S.fver;return FIDX;}

let wake=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock)wake=await navigator.wakeLock.request('screen');else if(wake){await wake.release();wake=null;}}catch{}}
function newRun(title){
  if(S.run&&!S.run.done){toast((EN?'A task is already running. Wait for it to finish.':'Τρέχει ήδη μια εργασία. Περίμενε να τελειώσει.'));return null;}
  const run={title,paused:false,stop:false,done:false,t0:Date.now(),total:0,i:0,note:'',phase:'',lines:{},consecErr:0};
  run.wait=async()=>{while(run.paused&&!run.stop)await sleep(250);};
  S.run=run;$('#prog').hidden=false;$('#progTitle').textContent=title;$('#progPause').hidden=false;$('#progStop').textContent=(EN?'Stop':'Διακοπή');
  keepAwake(true);watchBattery(run);updProg(true);return run;}
function endRun(run,msg){run.done=true;keepAwake(false);$('#progPause').hidden=true;$('#progStop').textContent=(EN?'Close':'Κλείσιμο');run.note=msg||'';run.i=run.total;updProg(true);S.ver++;S.fver++;}
let progT=0;
function updProg(force){const now=Date.now();if(!force&&now-progT<250)return;progT=now;const r=S.run;if(!r)return;
  $('#progBar').style.width=(r.total?Math.min(100,r.i/r.total*100):(r.done?100:3))+'%';
  let eta='';if(r.total&&r.i>5&&!r.done&&!r.paused){const sec=(now-r.t0)/1000;eta=(EN?' · about ':' · απομένουν ~')+fmtDur(sec/r.i*(r.total-r.i));}
  $('#progText').innerHTML=(r.phase?`<b>${esc(r.phase)}</b> · `:'')+(r.total?`${fmtN(r.i)} / ${fmtN(r.total)}`:'')+eta+'<br>'+
    Object.entries(r.lines).map(([k,v])=>`${esc(k)}: <b>${esc(typeof v==='number'?fmtN(v):v)}</b>`).join(' · ');
  $('#progNote').textContent=r.note||'';$('#progPause').textContent=r.paused?(EN?'Resume':'Συνέχεια'):(EN?'Pause':'Παύση');}
function watchBattery(run){if(!navigator.getBattery)return;navigator.getBattery().then(b=>{const chk=()=>{if(run.done)return;
  if(!b.charging&&b.level<0.2&&!run.paused){run.paused=true;run.autoPaused=true;run.note=(EN?'🔋 Low battery — paused for safety. Plug in the charger.':'🔋 Χαμηλή μπαταρία — έγινε παύση για ασφάλεια. Σύνδεσε τον φορτιστή.');updProg(true);}
  else if(b.charging&&run.autoPaused){run.paused=false;run.autoPaused=false;run.note='';updProg(true);}};
  b.addEventListener('levelchange',chk);b.addEventListener('chargingchange',chk);chk();}).catch(()=>{});}
$('#progPause').onclick=()=>{const r=S.run;if(!r||r.done)return;r.paused=!r.paused;r.autoPaused=false;if(!r.paused)r.note='';updProg(true);};
$('#progStop').onclick=()=>{const r=S.run;if(!r)return;if(r.done){$('#prog').hidden=true;S.run=null;render();return;}
  if(confirm((EN?'Stop the task?\nEverything done so far is saved and you can continue later from where it stopped.':'Να σταματήσει η εργασία;\nΌ,τι έγινε μένει αποθηκευμένο και μπορείς να συνεχίσεις αργότερα από εκεί που έμεινε.'))){r.stop=true;r.paused=false;}};
window.addEventListener('beforeunload',e=>{if(S.run&&!S.run.done){e.preventDefault();e.returnValue='';}});
function readError(src,path,e,run){
  if(e&&e.name==='NotFoundError'){logErr((EN?`Not found: ${src.name}/${path.join('/')}`:`Δεν βρέθηκε: ${src.name}/${path.join('/')}`),e);return;}
  src.errors=(src.errors||0)+1;src.suspicious=true;logErr((EN?`Read error: ${src.name}/${path.join('/')}`:`Σφάλμα ανάγνωσης: ${src.name}/${path.join('/')}`),e);
  if(run){run.lines[(EN?'Errors':'Σφάλματα')]=(run.lines[(EN?'Errors':'Σφάλματα')]||0)+1;run.consecErr++;
    if(run.consecErr>=5&&!run.paused){run.paused=true;run.consecErr=0;run.note=(EN?'⚠️ Many read errors in a row. Was the drive disconnected, or does it have bad sectors? Check it and press «Resume».':'⚠️ Πολλά σφάλματα ανάγνωσης στη σειρά. Μήπως αποσυνδέθηκε ο δίσκος ή έχει χαλασμένους τομείς; Έλεγξέ τον και πάτα «Συνέχεια».');}}
  clearTimeout(readError.t);readError.t=setTimeout(saveSources,1000);}

async function testDest(d){
  try{const data=new Uint8Array(1024*1024);for(let i=0;i<data.length;i+=65536)crypto.getRandomValues(data.subarray(i,i+65536));
    const name='.dokimi-'+Date.now()+'.bin';await writeRel(d.handle,`${META}/${name}`,new Blob([data]));
    const back=new Uint8Array(await (await readRel(d.handle,`${META}/${name}`)).arrayBuffer());
    let ok=back.length===data.length;for(let i=0;ok&&i<data.length;i++)if(back[i]!==data[i])ok=false;
    await (await d.handle.getDirectoryHandle(META)).removeEntry(name);d.test=ok?'ok':'bad';d.testErr=ok?'':(EN?'The data read back was not the same as what was written!':'Τα δεδομένα που διαβάστηκαν δεν ήταν ίδια με αυτά που γράφτηκαν!');
  }catch(e){d.test='bad';d.testErr=String(e.message||e);}
  d.tested=Date.now();await saveDests();return d.test==='ok';}

  const isLib=h.name===LIB_DIR||await hasDir(h,META);
  const lib=isLib?h:await h.getDirectoryHandle(LIB_DIR,{create:true});
  for(const d of S.dests)if(await d.handle.isSameEntry(lib))return toast((EN?'This folder is already selected.':'Αυτός ο φάκελος είναι ήδη επιλεγμένος.'));
  for(const s of S.sources)if(s.handle&&await lib.resolve(s.handle))return toast((EN?'The folder «':'Ο φάκελος «')+s.name+(EN?'» is already inside this destination. Remove it from the sources first.':'» είναι ήδη μέσα σε αυτόν τον προορισμό. Αφαίρεσέ τον πρώτα από τις πηγές.'));

  if(!ok)toast((EN?'⚠️ The write test failed! Don’t use it. Choose another drive.':'⚠️ Η δοκιμή εγγραφής απέτυχε! Μην τον χρησιμοποιήσεις. Διάλεξε άλλον δίσκο.'),8000);
  else toast(role==='backup'?(EN?'✅ The 2nd copy is ready. The «Double check» will fill it with everything already copied.':'✅ Το 2ο αντίγραφο ετοιμάστηκε. Ο «Διπλός έλεγχος» θα το γεμίσει με όσες έχουν ήδη αντιγραφεί.'):(EN?'✅ The destination was tested and is fine.':'✅ Ο προορισμός δοκιμάστηκε και είναι εντάξει.'),6000);
  if(isLib)await importIndex(d);
  render();}
async function pickSource(){

/* ---------------- ΜΑΖΕΜΑ: σκανάρισμα → αντιγραφή → 1ος έλεγχος ---------------- */
async function scanSource(s,run,groups){
  const stack=[{h:s.handle,p:[]}];
  const addGroup=async g=>{const key=g.s+'|'+[...g.p,g.main.name].join('/');
    if(S.srcIndex.has(key)){run.lines[(EN?'Already done':'Ήδη έτοιμες')]=(run.lines[(EN?'Already done':'Ήδη έτοιμες')]||0)+1;return;}
    try{const f=await g.main.fh.getFile();g.size=f.size;if(!g.video&&f.size<S.settings.minKB*1024){run.lines[(EN?'Small/icons':'Μικρές/εικονίδια')]=(run.lines[(EN?'Small/icons':'Μικρές/εικονίδια')]||0)+1;return;}
      for(const c of g.comps){try{g.size+=(await c.fh.getFile()).size;}catch{}}}
    catch(e){readError(s,[...g.p,g.main.name],e,run);return;}
    groups.push(g);run.lines[(EN?'Found':'Βρέθηκαν')]++;};
  while(stack.length){
    await run.wait();if(run.stop)return;
    const {h,p}=stack.pop();const files=[];
    const inPhotosLib=p.length&&/\.photoslibrary$/i.test(p[p.length-1]);
    try{for await(const [name,child] of h.entries()){
      if(child.kind==='directory'){const low=name.toLowerCase();
        if(inPhotosLib){if(low==='originals'||low==='masters')stack.push({h:child,p:[...p,name]});continue;}
        if(SKIP_DIRS.has(low)||low.startsWith('.')||low.startsWith('$')||low.endsWith('.app'))continue;
        if(name===LIB_DIR||await hasDir(child,META)){logErr((EN?`Skipped «${[...p,name].join('/')}»: it is a Mnimes library.`:`Παραλείφθηκε «${[...p,name].join('/')}»: είναι βιβλιοθήκη Μνήμες.`));continue;} // ποτέ η βιβλιοθήκη ως πηγή
        const cp=[...p,name];if(s.excl&&s.excl.includes(cp.join('/')))continue;stack.push({h:child,p:cp});
      }else files.push([name,child]);}}
    catch(e){readError(s,p,e,run);continue;}
    run.lines[(EN?'Folders':'Φάκελοι')]++;
    const byBase=new Map();
    for(const [name,fh] of files){const ext=extOf(name);if(!IMG_EXT.has(ext)&&!VID_EXT.has(ext)&&!SIDE_EXT.has(ext))continue;if(name.startsWith('._'))continue;
      const k=baseOf(name).toLowerCase();if(!byBase.has(k))byBase.set(k,[]);byBase.get(k).push({name,ext,fh});}
    for(const list of byBase.values()){
      const imgs=list.filter(x=>IMG_EXT.has(x.ext)).sort((a,b)=>(RANK[a.ext]??5)-(RANK[b.ext]??5));
      const vids=list.filter(x=>VID_EXT.has(x.ext)),side=list.filter(x=>SIDE_EXT.has(x.ext));
      if(imgs.length)await addGroup({s:s.id,p,main:imgs[0],comps:[...imgs.slice(1),...vids,...side],video:false});
      else if(S.settings.videos&&vids.length){await addGroup({s:s.id,p,main:vids[0],comps:side,video:true});for(const v of vids.slice(1))await addGroup({s:s.id,p,main:v,comps:[],video:true});}
    }
    updProg();}
}
async function clashAt(d,rel,fl){if(!await relExists(d.handle,rel))return false;
  try{const ex=await readRel(d.handle,rel);if(ex.size===fl.size&&await hashFile(ex)===fl.h)return false;}catch{}return true;}
const reserved=new Set();
async function uniqueBase(p){
  const dir=folderFor(p);
  const stem=p.date?(p.date.slice(0,10)+(p.ds==='exif'||p.date.slice(11)!=='12:00:00'?'_'+p.date.slice(11,19).replace(/:/g,'-'):'')):safeName(baseOf(p.name));
  const inTrash=new Set([...S.photos.values()].filter(q=>q.trashed&&!q.purged).flatMap(q=>q.files.map(fl=>(fl.rel||'').replace(/\.[^./]+$/,'').toLowerCase())));
  for(let n=1;n<100000;n++){const b=dir+'/'+stem+(n>1?'_'+n:'');if(reserved.has(b.toLowerCase())||inTrash.has(b.toLowerCase()))continue;
    let clash=false;for(const d of S.dests){for(const fl of p.files)if(await clashAt(d,b+'.'+fl.ext,fl)){clash=true;break;}if(clash)break;}
    if(!clash){reserved.add(b.toLowerCase());return b;}}
  throw new Error((EN?'No free file name found':'Δεν βρέθηκε ελεύθερο όνομα'));}
async function copyFileToDests(p,fl,data,run){
  fl.v1=fl.v1||{};
  for(const d of S.dests){
    try{
      if(await relExists(d.handle,fl.rel)){const ex=await readRel(d.handle,fl.rel);if(await hashFile(ex)===fl.h){fl.v1[d.id]=true;continue;}throw new Error((EN?'Another file with this name already exists':'Υπάρχει ήδη άλλο αρχείο με αυτό το όνομα'));}
      await writeRel(d.handle,fl.rel,new Blob([data]));
      const back=await readRel(d.handle,fl.rel);                 // 1ος έλεγχος: ξαναδιάβασμα από τον δίσκο
      const ok=back.size===fl.size&&await hashFile(back)===fl.h;fl.v1[d.id]=ok;
      if(!ok){run.lines[(EN?'Errors':'Σφάλματα')]=(run.lines[(EN?'Errors':'Σφάλματα')]||0)+1;logErr((EN?`❌ The copy does NOT match: ${d.name}/${fl.rel}`:`❌ Το αντίγραφο ΔΕΝ ταιριάζει: ${d.name}/${fl.rel}`));}
    }catch(e){fl.v1[d.id]=false;run.lines[(EN?'Errors':'Σφάλματα')]=(run.lines[(EN?'Errors':'Σφάλματα')]||0)+1;logErr((EN?`Copy failed on ${d.name}: ${fl.rel}`:`Αποτυχία αντιγραφής σε ${d.name}: ${fl.rel}`),e);
      if(isFull(e)){run.stop=true;run.note=(EN?'💽 The destination drive is full! Copying stopped safely.':'💽 Γέμισε ο δίσκος προορισμού! Η αντιγραφή σταμάτησε με ασφάλεια.');}}}}
async function processGroup(g,run){
  const src=S.sources[g.s];const mainPath=[...g.p,g.main.name];const key=g.s+'|'+mainPath.join('/');
  if(S.srcIndex.has(key))return;
  let r;try{r=await readHashed(()=>g.main.fh.getFile());}catch(e){readError(src,mainPath,e,run);return;}
  run.consecErr=0;
  const {f,buf,h}=r;
  const prot=mainPath.some(x=>/\.photoslibrary$/i.test(x))||undefined;
  let p=S.photos.get(h);
  if(p){ // διπλότυπο: αντιγράφεται ΜΙΑ φορά, αλλά καταγράφεται κάθε θέση
    const mf=p.files[0];if(!mf.srcs.some(x=>x.s===g.s&&x.p.join('/')===mainPath.join('/')))mf.srcs.push({s:g.s,p:mainPath,ok:null,prot});
    for(const c of g.comps){const cf=p.files.find(x=>x.role==='comp'&&x.ext===c.ext);if(!cf)continue;
      try{const cr=await readHashed(()=>c.fh.getFile());if(cr.h===cf.h){const cp=[...g.p,c.name];if(!cf.srcs.some(x=>x.s===g.s&&x.p.join('/')===cp.join('/')))cf.srcs.push({s:g.s,p:cp,ok:null,prot});S.srcIndex.add(g.s+'|'+cp.join('/'));}}
      catch(e){readError(src,[...g.p,c.name],e,run);}}
    S.srcIndex.add(key);run.lines[(EN?'Duplicates':'Διπλότυπα')]++;await savePhoto(p);return;}
  const meta=await readMeta(buf||f,g.main.name,f.lastModified,g.video);
  const place=meta.lat!=null?await placeName(meta.lat,meta.lon):null;
  p={h,name:g.main.name,ext:g.main.ext,size:f.size,date:meta.date,ds:meta.ds,lat:meta.lat,lon:meta.lon,place,video:g.video,added:Date.now(),fa:false,
     files:[{role:'main',ext:g.main.ext,h,size:f.size,srcs:[{s:g.s,p:mainPath,ok:null,prot}],rel:null,v1:{},v2:null}]};
  // Τα δεδομένα γράφονται ΑΥΤΟΥΣΙΑ (byte προς byte): ίδια ανάλυση, ίδια ποιότητα, ίδια EXIF — καμία συμπίεση/αλλαγή.
  const datas=[buf||f];
  for(const c of g.comps){try{const cr=await readHashed(()=>c.fh.getFile());const ch=cr.h;const cp=[...g.p,c.name];
      p.files.push({role:'comp',ext:c.ext,h:ch,size:cr.f.size,srcs:[{s:g.s,p:cp,ok:null,prot}],rel:null,v1:{},v2:null});datas.push(cr.buf||cr.f);S.srcIndex.add(g.s+'|'+cp.join('/'));}
    catch(e){readError(src,[...g.p,c.name],e,run);}}
  const th=g.video?await videoThumb(f):await makeThumb(f,buf);
  if(th){p.w=th.w;p.hgt=th.h;p.dec=th.dec;await storeThumb(h,th.blob);}
  const base=await uniqueBase(p);
  p.files.forEach(fl=>fl.rel=base+'.'+fl.ext);
  for(let i=0;i<p.files.length;i++){if(run.stop&&run.note.startsWith('💽'))break;await copyFileToDests(p,p.files[i],datas[i],run);}
  if(th&&S.dests[0])writeRel(S.dests[0].handle,`${META}/thumbs/${h}.jpg`,th.blob).catch(()=>{});
  S.photos.set(h,p);S.srcIndex.add(key);await savePhoto(p);run.lines[(EN?'New':'Νέες')]++;scheduleIndexSave();}
async function runOrganize(){
  if(!S.dests.length)return toast((EN?'First choose where the photos will go (step ①).':'Διάλεξε πρώτα πού θα μπουν οι φωτογραφίες (βήμα ①).'));
  const srcs=S.sources.filter(s=>s.handle&&!s.removed);if(!srcs.length)return toast((EN?'Add at least one folder or drive (step ②).':'Πρόσθεσε τουλάχιστον έναν φάκελο ή δίσκο (βήμα ②).'));

    if(await permState(d.handle,'readwrite')!=='granted')return toast((EN?'Permission needed for «':'Χρειάζεται άδεια για «')+d.name+(EN?'». Press the «Connect» button at the top.':'». Πάτα το κουμπί «Σύνδεση» πάνω.'));}
  for(const s of srcs)if(await permState(s.handle)!=='granted')return toast((EN?'Permission needed for «':'Χρειάζεται άδεια για «')+s.name+(EN?'». Press the «Connect» button at the top.':'». Πάτα το κουμπί «Σύνδεση» πάνω.'));
  for(const d of S.dests)if(!await testDest(d))return toast((EN?'⚠️ The destination «':'⚠️ Ο προορισμός «')+d.name+(EN?'» failed the write test just now! Stopping for safety.':'» απέτυχε στη δοκιμή εγγραφής τώρα! Σταματάω για ασφάλεια.'),8000);
  const run=newRun((EN?'📥 Collecting photos':'📥 Μάζεμα φωτογραφιών'));if(!run)return;
  run.phase=(EN?'① Scanning':'① Σκανάρισμα');run.lines={[EN?'Folders':'Φάκελοι']:0,[EN?'Found':'Βρέθηκαν']:0};
  const groups=[];
  for(const s of srcs){if(run.stop)break;s.excl=[];let skip=false;
    for(const d of S.dests){try{if(await s.handle.isSameEntry(d.handle)||await d.handle.resolve(s.handle)){skip=true;break;}const r=await s.handle.resolve(d.handle);if(r)s.excl.push(r.join('/'));}catch{}}
    if(skip){logErr((EN?`Skipped «${s.name}»: it is inside the library.`:`Παραλείφθηκε «${s.name}»: είναι μέσα στη βιβλιοθήκη.`));continue;}
    run.note=(EN?'Scanning: ':'Σκανάρω: ')+s.name;await scanSource(s,run,groups);}
  if(run.stop)return endRun(run,(EN?'Stopped while scanning — nothing was copied.':'Διακόπηκε στο σκανάρισμα — δεν αντιγράφηκε τίποτα.'));
  if(!groups.length)return endRun(run,(EN?'✅ No new photos found. Everything is already sorted!':'✅ Δεν βρέθηκαν νέες φωτογραφίες. Όλα είναι ήδη τακτοποιημένα!'));
  const bytes=groups.reduce((a,g)=>a+(g.size||0),0),need=bytes*1.05+512*1024*1024;
  const nv=groups.filter(g=>g.video).length;
  run.phase=(EN?'Space check':'Έλεγχος χώρου');run.note=(EN?'💽 Checking whether they fit…':'💽 Ελέγχω αν χωράνε…');updProg(true);
  const space=[];
  for(const d of S.dests){const ok=await checkSpace(d,need);space.push(ok);
    if(ok===false){logErr((EN?`They don’t fit on «${d.name}»: ${fmtSize(need)} needed`:`Δεν χωράνε στο «${d.name}»: χρειάζονται ${fmtSize(need)}`));
      return endRun(run,(EN?`💽 THEY DON’T FIT on «${d.name}»! About ${fmtSize(need)} of free space is needed. Nothing was copied. Free up space or choose a bigger drive (e.g. an external one).`:`💽 ΔΕΝ ΧΩΡΑΝΕ στο «${d.name}»! Χρειάζονται περίπου ${fmtSize(need)} ελεύθερα. Δεν αντιγράφηκε τίποτα. Ελευθέρωσε χώρο ή διάλεξε μεγαλύτερο δίσκο (π.χ. εξωτερικό).`));}}
  run.phase=(EN?'Ready to copy':'Έτοιμο για αντιγραφή');run.paused=true;
  run.note=(EN?`Found ${fmtN(groups.length-nv)} photos and ${fmtN(nv)} videos (${fmtSize(bytes)}). `:`Βρέθηκαν ${fmtN(groups.length-nv)} φωτογραφίες και ${fmtN(nv)} βίντεο (${fmtSize(bytes)}). `)+
    (space.every(x=>x===true)?(EN?`✅ Space checked: they fit (about ${fmtSize(need)} needed). `:`✅ Ο χώρος ελέγχθηκε: χωράνε (χρειάζονται ~${fmtSize(need)}). `):(EN?`⚠️ I couldn’t check the space — make sure at least ${fmtSize(need)} is free. `:`⚠️ Δεν μπόρεσα να ελέγξω τον χώρο — βεβαιώσου ότι υπάρχουν τουλάχιστον ${fmtSize(need)} ελεύθερα. `))+
    (EN?'Press «▶ Resume» to copy.':'Πάτα «▶ Συνέχεια» για αντιγραφή.');
  updProg(true);await run.wait();
  if(run.stop)return endRun(run,(EN?'Cancelled before copying — nothing was copied.':'Ακυρώθηκε πριν την αντιγραφή — δεν αντιγράφηκε τίποτα.'));
  run.note='';run.phase=(EN?'② Copy & 1st check':'② Αντιγραφή & 1ος έλεγχος');run.total=groups.length;run.i=0;run.t0=Date.now();
  run.lines={[EN?'New':'Νέες']:0,[EN?'Duplicates':'Διπλότυπα']:0,[EN?'Errors':'Σφάλματα']:run.lines[(EN?'Errors':'Σφάλματα')]||0};
  for(const g of groups){await run.wait();if(run.stop)break;
    try{await processGroup(g,run);}catch(e){logErr((EN?'Error in ':'Σφάλμα στο ')+g.main.name,e);run.lines[(EN?'Errors':'Σφάλματα')]++;if(isFull(e)){run.stop=true;run.note=(EN?'💽 The destination drive is full!':'💽 Γέμισε ο δίσκος προορισμού!');}}
    run.i++;updProg();}
  await saveSources();await saveIndex();
  const note=run.note;
  if(!run.stop&&run.lines[(EN?'New':'Νέες')]>0)setTimeout(()=>{if(S.run&&S.run.done){$('#prog').hidden=true;S.run=null;}runVerify(true);},1500); // αυτόματος 2ος έλεγχος για τις νέες
  endRun(run,run.stop?(note||(EN?'Stopped. Press «Start» again whenever you like — it continues from where it stopped.':'Σταμάτησε. Πάτα ξανά «Ξεκίνα» όποτε θέλεις — συνεχίζει από εκεί που έμεινε.'))
    :(EN?`✅ Done! ${fmtN(run.lines[(EN?'New':'Νέες')])} new photos/videos, ${fmtN(run.lines[(EN?'Duplicates':'Διπλότυπα')])} duplicates. Next step: «✅ Double check».`:`✅ Έτοιμο! ${fmtN(run.lines["Νέες"])} νέες φωτογραφίες/βίντεο, ${fmtN(run.lines['Διπλότυπα'])} διπλότυπα. Επόμενο βήμα: «✅ Διπλός έλεγχος».`));}

async function runVerify(onlyNew){onlyNew=onlyNew===true;
  for(const d of S.dests)if(await permState(d.handle,'readwrite')!=='granted')return toast((EN?'Permission needed for «':'Χρειάζεται άδεια για «')+d.name+(EN?'». Press «Connect» at the top.':'». Πάτα «Σύνδεση» πάνω.'));
  const list=[...S.photos.values()].filter(p=>!p.viewOnly&&!p.trashed&&p.files[0].rel&&(!onlyNew||p.files.some(fl=>!fl.v2)));
  if(!list.length)return toast((EN?'There are no copied photos yet.':'Δεν υπάρχουν ακόμα αντιγραμμένες φωτογραφίες.'));
  const usedSrc=new Set();for(const p of list)for(const fl of p.files)for(const src of fl.srcs)if(!src.deleted)usedSrc.add(src.s);
  const noPerm=[];for(const i of usedSrc){const s=S.sources[i];if(!s||!s.handle||s.removed)continue;if(await permState(s.handle)!=='granted'&&!await ensurePerm(s.handle))noPerm.push(s.name);}
  if(noPerm.length&&!confirm((EN?`⚠️ I don’t have permission to read the ORIGINALS in:\n• ${noPerm.join('\n• ')}\n\nWithout it, these originals are NOT checked and you will NOT be able to delete them.\nPress «Cancel» and then the 🔓 buttons at the top (or connect the drive).\n\nContinue anyway?`:`⚠️ Δεν έχω άδεια να διαβάσω τα ΑΡΧΙΚΑ σε:\n• ${noPerm.join('\n• ')}\n\nΧωρίς αυτήν, αυτά τα αρχικά ΔΕΝ ελέγχονται και ΔΕΝ θα μπορείς να τα σβήσεις.\nΠάτα «Άκυρο» και μετά τα κουμπιά 🔓 στο πάνω μέρος (ή σύνδεσε τον δίσκο).\n\nΝα συνεχίσω παρ' όλα αυτά;`)))return render();
  const run=newRun((EN?'✅ 2nd check':'✅ 2ος έλεγχος'));if(!run)return;
  run.phase=(EN?'Verification':'Επαλήθευση');run.total=list.length;run.lines={[EN?'OK':'Εντάξει']:0,[EN?'Repaired':'Επισκευάστηκαν']:0,[EN?'Problems':'Προβλήματα']:0,[EN?'Originals not checked (no permission)':'Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)']:0};
  for(const p of list){await run.wait();if(run.stop)break;let photoOk=true;
    for(const fl of p.files){
      let srcBuf=null;
      for(const src of fl.srcs){if(src.deleted)continue;const s=S.sources[src.s];if(!s||!s.handle||await permState(s.handle)!=='granted'){run.lines[(EN?'Originals not checked (no permission)':'Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)')]++;continue;}
        try{const f=await (await fileHandleAt(s.handle,src.p)).getFile();src.ok=f.size===fl.size&&(await hashFile(f))===fl.h;src.why=src.ok?'':(EN?'the original changed':'το αρχικό άλλαξε');if(src.ok&&!srcBuf)srcBuf=f;}
        catch(e){src.ok=false;src.why=e.name==='NotFoundError'?(EN?'missing':'λείπει'):(EN?'read error':'σφάλμα ανάγνωσης');if(e.name!=='NotFoundError')readError(s,src.p,e,null);}}
      let allOk=true;fl.v1=fl.v1||{};
      for(const d of S.dests){let ok=false;
        try{const f=await readRel(d.handle,fl.rel);ok=f.size===fl.size&&(await hashFile(f))===fl.h;}catch{}
        if(!ok&&srcBuf){try{await writeRel(d.handle,fl.rel,new Blob([srcBuf]));const f2=await readRel(d.handle,fl.rel);ok=(await hashFile(f2))===fl.h;
          if(ok){run.lines[(EN?'Repaired':'Επισκευάστηκαν')]++;logErr((EN?`🔧 Rewritten correctly: ${d.name}/${fl.rel}`:`🔧 Ξαναγράφτηκε σωστά: ${d.name}/${fl.rel}`));}}catch(e){if(isFull(e)){run.stop=true;run.note=(EN?'💽 The drive is full «':'💽 Γέμισε ο δίσκος «')+d.name+'».';}}}
        fl.v1[d.id]=ok;if(!ok){allOk=false;logErr((EN?`❌ Copy problem: ${d.name}/${fl.rel}`:`❌ Πρόβλημα αντιγράφου: ${d.name}/${fl.rel}`));}}
      if(allOk&&fl.role==='main'&&!p.video&&DECODE_EXT.has(fl.ext)){
        try{const b=await readRel(S.dests[0].handle,fl.rel);const bm=await createImageBitmap(b);bm.close&&bm.close();fl.corrupt=false;}
        catch(e){allOk=false;fl.corrupt=true;logErr((EN?`❌ The image doesn’t open (corrupt?): ${fl.rel}`:`❌ Η εικόνα δεν ανοίγει (χαλασμένη;): ${fl.rel}`));}}
      fl.v2=allOk?Date.now():null;if(!allOk)photoOk=false;}
    run.lines[photoOk?(EN?'OK':'Εντάξει'):(EN?'Problems':'Προβλήματα')]++;run.i++;await savePhoto(p);updProg();}
  await saveSources();await saveIndex();
  const st=stats();
  endRun(run,run.stop?(EN?'Stopped. You can run it again whenever you like.':'Σταμάτησε. Μπορείς να τον ξανατρέξεις όποτε θέλεις.'):
    (EN?`${st.v2===st.files?'✅':'⚠️'} Verified ${fmtN(st.v2)} of ${fmtN(st.files)} files in ${S.dests.length} ${S.dests.length>1?'copies':'copy'}. ${run.lines[(EN?'Problems':'Προβλήματα')]?'See the «📊 Report» for the problems.':''}${run.lines[(EN?'Originals not checked (no permission)':'Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)')]?` ⚠️ ${fmtN(run.lines[(EN?'Originals not checked (no permission)':'Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)')])} originals were NOT checked (no permission) — give permission with the 🔓 buttons at the top and run it again, otherwise they won’t be deleted.`:(run.lines[(EN?'Problems':'Προβλήματα')]?'':'All perfect!')}`:`${st.v2===st.files?'✅':'⚠️'} Επαληθεύτηκαν ${fmtN(st.v2)} από ${fmtN(st.files)} αρχεία σε ${S.dests.length} ${S.dests.length>1?'αντίγραφα':'αντίγραφο'}. ${run.lines['Προβλήματα']?'Δες την «📊 Αναφορά» για τα προβλήματα.':''}${run.lines['Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)']?` ⚠️ ${fmtN(run.lines['Αρχικά που δεν ελέγχθηκαν (χωρίς άδεια)'])} αρχικά ΔΕΝ ελέγχθηκαν (χωρίς άδεια) — δώσε άδεια με τα κουμπιά 🔓 πάνω και ξανατρέξε, αλλιώς δεν σβήνονται.`:(run.lines['Προβλήματα']?'':'Όλα τέλεια!')}`));}
function stats(){let files=0,v1=0,v2=0,locs=0,dupLocs=0,bytes=0,deleted=0,viewOnly=0;
  for(const p of S.photos.values()){if(p.trashed)continue;if(p.viewOnly){viewOnly++;continue;}
    for(const fl of p.files){files++;bytes+=fl.size||0;if(S.dests.length&&S.dests.every(d=>fl.v1&&fl.v1[d.id]))v1++;if(fl.v2)v2++;
      const live=fl.srcs.filter(s=>!s.deleted).length;locs+=fl.srcs.length;if(fl.role==='main'&&live>1)dupLocs+=live-1;deleted+=fl.srcs.filter(s=>s.deleted).length;}}
  return {photos:S.photos.size,files,v1,v2,locs,dupLocs,bytes,deleted,viewOnly};}

/* ---------------- ΚΑΘΑΡΙΣΜΟΣ ΑΡΧΙΚΩΝ (με κλειδαριές) ---------------- */
function deletionCandidates(){const out=[],b={notv2:0,susp:0,prot:0,srcbad:0,unchecked:0,nobackup:0,nohandle:0};
  for(const p of S.photos.values()){if(p.viewOnly||p.trashed)continue;
    for(const fl of p.files)for(const src of fl.srcs){if(src.deleted)continue;const s=S.sources[src.s];
      if(!s||!s.handle||s.removed){b.nohandle++;continue;}
      if(S.settings.requireBackup&&S.dests.length<2){b.nobackup++;continue;}
      if(!fl.v2||!S.dests.length||!S.dests.every(d=>fl.v1&&fl.v1[d.id])){b.notv2++;continue;}
      if(src.ok!==true){if(src.ok===false)b.srcbad++;else b.unchecked++;continue;}
      if(s.suspicious){b.susp++;continue;}
      if(src.prot||src.p.includes(LIB_DIR)||src.p.some(x=>x.toLowerCase()===META.toLowerCase())){b.prot++;continue;}
      out.push({p,fl,src,s,cloud:CLOUD_RE.test(s.name+'/'+src.p.join('/'))});}}
  return {out,blocked:b};}
async function jitCheck(c){ // 3ος έλεγχος, ακριβώς πριν το σβήσιμο

let LB=null;

async function showLB(){const {list,idx}=LB,p=list[idx],tok=LB.tok={};$('#lbCount').textContent=`${idx+1} / ${list.length}`;

  const b=await photoBlob(p);if(!LB||tok!==LB.tok||!b)return;const u=URL.createObjectURL(b);const t=new Image();
  t.onload=()=>{if(LB&&tok===LB.tok){img.src=u;LB.url=u;}else URL.revokeObjectURL(u);};t.onerror=()=>URL.revokeObjectURL(u);t.src=u;}

(async()=>{
