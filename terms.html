<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Μνήμες · Όροι χρήσης και άδειες</title>
<meta name="author" content="Κωνσταντίνος Τσιμινάκης">
<meta name="copyright" content="© 2026 Κωνσταντίνος Τσιμινάκης">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#0e1014;--muted:#5f6672;--line:#e3e5ea;--accent:#5b5bf0;--font:"Inter","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0a0b0f;--card:#14161c;--ink:#f3f4f6;--muted:#9aa1ad;--line:#252832;--accent:#9b9cff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--font);padding:24px max(16px,env(safe-area-inset-left,0px)) 64px max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}
.top a{color:var(--accent);font-weight:600;text-decoration:none}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{border:0;background:none;color:var(--muted);font:600 13.5px var(--font);padding:6px 12px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1{font-size:clamp(28px,4vw,38px);letter-spacing:-.03em;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin:0 0 12px}
.card h2{font-size:18px;margin:0 0 6px}
.card p{margin:.35em 0;color:var(--muted)}
.cp{font-weight:600}
pre{white-space:pre-wrap;font:13px/1.55 ui-monospace,Consolas,monospace;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;overflow-x:auto}
a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="./" id="back">← Μνήμες</a><div class="lang"><button type="button" data-lang="el" aria-pressed="true">EL</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></div>
  <h1 id="h"></h1>
  <p class="cp" id="cp"></p><p id="cr" style="color:var(--muted);margin-top:-6px"></p>
  <div id="list"></div>
  <h2 id="lh" style="margin-top:28px"></h2>
  <pre id="lic"></pre>
</div>
<script>
function build(EN){
const COPY=EN?'© 2026 Konstantinos Tsiminakis · All rights reserved':'© 2026 Κωνσταντίνος Τσιμινάκης · Με επιφύλαξη παντός δικαιώματος';
const CREDIT=EN?'Created by Konstantinos Tsiminakis, son of Alexandros':'Δημιουργία του Τσιμινάκη Κωνσταντίνου του Αλεξάνδρου';
const TERMS=EN?[
 ['What it is','Mnimes is a free app that copies your photos and videos from the folders and drives you choose into one library folder, sorted by year, month and place, and shows them in a calendar and a map. It runs entirely in your browser, on your own computer.'],
 ['Your data stays with you','Your photos and videos never leave your computer and the creator never sees or collects them. The app’s index stays in this browser (IndexedDB) and in the «Μνήμες/_PhotoApp» folder of your library. There is no account, no ads and no tracking.'],
 ['What is sent over the internet','• Place names: only coordinates rounded to 2 decimals (about 1 km) go to BigDataCloud and, if needed, to OpenStreetMap Nominatim. You can turn this off in Settings.\n• Map: map pieces come from Esri’s servers, which see your IP address and the area you look at.\n• Font and libraries: the Inter font comes from Google Fonts and the exifr and Leaflet libraries from jsDelivr and cdnjs, which see your IP address.\nNo photo, file name or folder name is ever sent.'],
 ['Your rights (GDPR)','The creator holds no personal data of yours. You can delete the app’s memory at any time from Settings → «Start over» (your photos are not touched). Questions: ktsiminakis@gmail.com. You may complain to the Hellenic Data Protection Authority (www.dpa.gr).'],
 ['Liability','The app is provided «as is», free of charge, without any warranty. The SHA-256 checks greatly reduce the risk but cannot remove it: drives fail, cables come loose, cloud folders sync. Before deleting originals, always keep a second copy on another drive. Deleting from a cloud folder (OneDrive, Google Drive, iCloud, Dropbox) also deletes from your other devices. The creator is not liable for any loss or damage from its use. Dates, places and duplicates are detected automatically and may be wrong.'],
 ['Copyright','The app (code, design, texts, images, name, presentation and videos) belongs to its creator. Copying, republishing, changing or selling it, in whole or in part, without the creator’s written permission is forbidden. Your photos are yours. Mnimes is an independent app and is not connected with Microsoft, Google, Apple, Esri or any other company named in it.'],
 ['Third-party software and data','exifr (MIT, © Mike Kovařík) · Leaflet (BSD-2-Clause, © Volodymyr Agafonkin, © CloudMade) · Lucide icons (ISC, © Lucide Contributors; parts MIT, © Cole Bemis / Feather) · Inter font (SIL Open Font License 1.1, © The Inter Project Authors) · map: Powered by Esri — © Esri and its data providers · place names: BigDataCloud, © OpenStreetMap contributors (ODbL). They belong to their creators and are used under their licences.'],
 ['Contact','Creator and responsible for the app: Konstantinos Tsiminakis · ktsiminakis@gmail.com']]
:[
 ['Τι είναι','Οι Μνήμες είναι δωρεάν εφαρμογή που αντιγράφει τις φωτογραφίες και τα βίντεό σου από τους φακέλους και τους δίσκους που διαλέγεις σε έναν φάκελο-βιβλιοθήκη, τακτοποιημένα ανά χρονιά, μήνα και μέρος, και τα δείχνει σε ημερολόγιο και χάρτη. Τρέχει ολόκληρη μέσα στον browser, στον δικό σου υπολογιστή.'],
 ['Τα δεδομένα σου μένουν σε σένα','Οι φωτογραφίες και τα βίντεό σου δεν φεύγουν ποτέ από τον υπολογιστή σου και ο δημιουργός δεν τα βλέπει ούτε τα συλλέγει. Το ευρετήριο της εφαρμογής μένει σε αυτόν τον browser (IndexedDB) και στον φάκελο «Μνήμες/_PhotoApp» της βιβλιοθήκης σου. Δεν υπάρχει λογαριασμός, διαφημίσεις ή παρακολούθηση.'],
 ['Τι στέλνεται στο ίντερνετ','• Ονόματα μερών: μόνο συντεταγμένες στρογγυλεμένες σε 2 δεκαδικά (περίπου 1 χλμ.) πάνε στο BigDataCloud και, αν χρειαστεί, στο OpenStreetMap Nominatim. Το κλείνεις από τις Ρυθμίσεις.\n• Χάρτης: τα κομμάτια του χάρτη έρχονται από τους servers της Esri, που βλέπουν τη διεύθυνση IP και την περιοχή που κοιτάς.\n• Γραμματοσειρά και βιβλιοθήκες: η γραμματοσειρά Inter έρχεται από το Google Fonts και οι βιβλιοθήκες exifr και Leaflet από τα jsDelivr και cdnjs, που βλέπουν τη διεύθυνση IP.\nΚαμία φωτογραφία, όνομα αρχείου ή φακέλου δεν στέλνεται ποτέ.'],
 ['Τα δικαιώματά σου (GDPR)','Ο δημιουργός δεν κρατά κανένα προσωπικό σου δεδομένο. Σβήνεις τη μνήμη της εφαρμογής όποτε θέλεις από Ρυθμίσεις → «Ξεκίνα από την αρχή» (οι φωτογραφίες σου δεν αγγίζονται). Για ερωτήσεις: ktsiminakis@gmail.com. Έχεις δικαίωμα καταγγελίας στην Αρχή Προστασίας Δεδομένων Προσωπικού Χαρακτήρα (www.dpa.gr).'],
 ['Ευθύνη','Η εφαρμογή δίνεται «ως έχει», δωρεάν, χωρίς καμία εγγύηση. Οι έλεγχοι SHA-256 μειώνουν πολύ τον κίνδυνο αλλά δεν τον μηδενίζουν: δίσκοι χαλάνε, καλώδια βγαίνουν, φάκελοι cloud συγχρονίζονται. Πριν σβήσεις αρχικά, κράτα πάντα δεύτερο αντίγραφο σε άλλον δίσκο. Το σβήσιμο από φάκελο cloud (OneDrive, Google Drive, iCloud, Dropbox) σβήνει και από τις άλλες συσκευές σου. Ο δημιουργός δεν ευθύνεται για απώλεια ή ζημιά από τη χρήση της. Ημερομηνίες, μέρη και διπλότυπα βρίσκονται αυτόματα και μπορεί να είναι λάθος.'],
 ['Πνευματικά δικαιώματα','Η εφαρμογή (κώδικας, σχέδιο, κείμενα, εικόνες, όνομα, παρουσίαση και βίντεο) ανήκει στον δημιουργό της. Απαγορεύεται η αντιγραφή, η αναδημοσίευση, η τροποποίηση ή η πώληση της εφαρμογής ή μέρους της χωρίς γραπτή άδεια του δημιουργού. Οι φωτογραφίες σου είναι δικές σου. Οι Μνήμες είναι ανεξάρτητη εφαρμογή και δεν συνδέονται με τη Microsoft, τη Google, την Apple, την Esri ή άλλη εταιρεία που αναφέρεται.'],
 ['Λογισμικό και δεδομένα τρίτων','exifr (MIT, © Mike Kovařík) · Leaflet (BSD-2-Clause, © Volodymyr Agafonkin, © CloudMade) · εικονίδια Lucide (ISC, © Lucide Contributors· τμήματα MIT, © Cole Bemis / Feather) · γραμματοσειρά Inter (SIL Open Font License 1.1, © The Inter Project Authors) · χάρτης: Powered by Esri — © Esri και οι πάροχοι δεδομένων της · ονόματα μερών: BigDataCloud, © OpenStreetMap contributors (ODbL). Ανήκουν στους δημιουργούς τους και χρησιμοποιούνται σύμφωνα με τις άδειές τους.'],
 ['Επικοινωνία','Δημιουργός και υπεύθυνος της εφαρμογής: Κωνσταντίνος Τσιμινάκης · ktsiminakis@gmail.com']];
const LUCIDE_LICENSE=`ISC License

Copyright (c) for portions of Lucide are held by Cole Bemis 2013-2022 as part of Feather (MIT). All other copyright (c) for Lucide are held by Lucide Contributors 2022.

Permission to use, copy, modify, and/or distribute this software for any purpose with or without fee is hereby granted, provided that the above copyright notice and this permission notice appear in all copies.

THE SOFTWARE IS PROVIDED "AS IS" AND THE AUTHOR DISCLAIMS ALL WARRANTIES WITH REGARD TO THIS SOFTWARE INCLUDING ALL IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS. IN NO EVENT SHALL THE AUTHOR BE LIABLE FOR ANY SPECIAL, DIRECT, INDIRECT, OR CONSEQUENTIAL DAMAGES OR ANY DAMAGES WHATSOEVER RESULTING FROM LOSS OF USE, DATA OR PROFITS, WHETHER IN AN ACTION OF CONTRACT, NEGLIGENCE OR OTHER TORTIOUS ACTION, ARISING OUT OF OR IN CONNECTION WITH THE USE OR PERFORMANCE OF THIS SOFTWARE.

The MIT License (MIT) — for portions derived from Feather

Copyright (c) 2013-2022 Cole Bemis

Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:

The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.

THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.`;

return {COPY,CREDIT,TERMS,LUCIDE_LICENSE};}
const OTHER="exifr — MIT License\nCopyright (c) 2019 Mike Kovařík\n\nPermission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the \"Software\"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.\n\n────────────────────────────\n\nLeaflet — BSD 2-Clause License\nCopyright (c) 2010-2023, Volodymyr Agafonkin\nCopyright (c) 2010-2011, CloudMade\nAll rights reserved.\n\nRedistribution and use in source and binary forms, with or without modification, are permitted provided that the following conditions are met:\n\n1. Redistributions of source code must retain the above copyright notice, this list of conditions and the following disclaimer.\n2. Redistributions in binary form must reproduce the above copyright notice, this list of conditions and the following disclaimer in the documentation and/or other materials provided with the distribution.\n\nTHIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS \"AS IS\" AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS FOR A PARTICULAR PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL THE COPYRIGHT HOLDER OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT, INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING, BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY, OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT OF THE USE OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF SUCH DAMAGE.\n\n────────────────────────────\n\nInter — SIL Open Font License, Version 1.1\nCopyright (c) 2016 The Inter Project Authors (https://github.com/rsms/inter)\nServed by Google Fonts. Full licence text: https://openfontlicense.org/open-font-license-official-text/\n\n────────────────────────────\n\nMap: Powered by Esri — © Esri, TomTom, Garmin, FAO, NOAA, USGS, © OpenStreetMap contributors. Esri terms: https://www.esri.com/en-us/legal/terms/full-master-agreement\nPlace names: BigDataCloud (https://www.bigdatacloud.com) and Nominatim, data © OpenStreetMap contributors, available under the Open Database License (ODbL): https://www.openstreetmap.org/copyright\n\n────────────────────────────\n\n";
function show(l){const EN=l==='en',D=build(EN);document.documentElement.lang=l;
  document.title=EN?'Mnimes · Terms of use and licences':'Μνήμες · Όροι χρήσης και άδειες';
  document.getElementById('h').textContent=EN?'Terms of use and licences':'Όροι χρήσης και άδειες';
  document.getElementById('back').textContent=EN?'← Mnimes':'← Μνήμες';document.getElementById('back').href=EN?'./?lang=en':'./?lang=el';
  document.getElementById('cp').textContent=D.COPY;document.getElementById('cr').textContent=D.CREDIT;
  const L=document.getElementById('list');L.textContent='';
  for(const [h,t] of D.TERMS){const c=document.createElement('section');c.className='card';const hh=document.createElement('h2');hh.textContent=h;c.append(hh);
    for(const x of t.split('\n')){const p=document.createElement('p');p.textContent=x;c.append(p);}L.append(c);}
  document.getElementById('lh').textContent=EN?'Full licence texts':'Πλήρη κείμενα αδειών';
  document.getElementById('lic').textContent=OTHER+'Lucide — '+D.LUCIDE_LICENSE;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===l));
  try{localStorage.setItem('lang',l);}catch(e){}}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>show(b.dataset.lang));
let s='el';try{s=new URLSearchParams(location.search).get('lang')||localStorage.getItem('lang')||((navigator.language||'el').toLowerCase().startsWith('el')?'el':'en');}catch(e){}
show(s==='en'?'en':'el');
</script>
</body>
</html>
